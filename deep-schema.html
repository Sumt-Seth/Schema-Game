    watch: "The database is the data; the database management system is the program that manages it." },
  { term: "File-based system", def: "The older approach in which each department or program keeps its own separate files, with no central manager.",
    more: "Each application defines and stores its own data. This causes the problems below (redundancy, inconsistency, isolation, weak integrity and security, poor concurrency). The database approach was developed specifically to solve them." },
  { term: "Data redundancy", def: "Storing the same fact in more than one place.",
    more: "Redundancy wastes storage and effort, because every copy has to be updated. Its real danger is inconsistency: if one copy changes and the others do not, the data contradicts itself. A database controls redundancy by storing each fact once and referring to it everywhere else.",
    ex: "A customer's address is kept in the billing file, the shipping file and the marketing file." },
  { term: "Data inconsistency", def: "Different copies of the same fact disagree with each other.",
    more: "Inconsistency is the result of uncontrolled redundancy. Once it happens, nobody can tell which copy is correct.",
    ex: "Billing says the customer lives on Elm Street, shipping still says Oak Street." },
  { term: "Data isolation", def: "Data is scattered across many files in different formats, so a new program has trouble getting the data it needs.",
    more: "In a file-based system each file was built for one program. Combining data from several of them means writing custom code for every file format." },
  { term: "Integrity and security problems", def: "Without a central manager, rules about valid data and about who may see data are written separately into each program.",
    more: "Integrity rules (for example, \"an account balance can't go below zero\") end up scattered across program code in an ad-hoc way, so they are easy to miss or contradict. Security is hard for the same reason: there is no single place to define who may read or change what. A database management system enforces both centrally." },
  { term: "Concurrency", def: "Many users reading and changing the same data at the same time.",
    more: "File systems often lock a whole file while one person uses it, blocking everyone else, or let two people overwrite each other's changes. A database management system controls concurrent access, typically at the row level, so many users can work at once safely." }
],
/* 2 · Coral Plateau · Relational Databases */
[
  { term: "Who created the relational model", def: "E. F. (Ted) Codd, a researcher at IBM, introduced the relational data model in 1970.",
    more: "The course textbook prints his name as 'C. F. Codd'. Don't mix him up with Peter Chen, who created the entity-relationship model." },
  { term: "Relational model", def: "A way of organizing data as a set of tables (relations) that are connected through shared key values.",
    more: "Instead of storing pointers between records, the relational model links tables by storing the same key value in both. Queries combine the tables when needed." },
  { term: "Relation", def: "The formal name for a table: a set of rows that all have the same columns.",
    more: "In a relation the order of rows and the order of columns do not matter, and no two rows are exactly the same." },
  { term: "Tuple", def: "The formal name for one row (one record) in a relation.",
    more: "Each tuple describes one instance of the thing the table is about, such as one student in a Student table." },
  { term: "Attribute", def: "The formal name for a column: one property that every row has.",
    more: "Each attribute has a name and a domain (the values it is allowed to hold)." },
  { term: "Degree", def: "The number of attributes (columns) in a relation.",
    more: "A table with columns StudentNumber, Name and Major has a degree of 3, no matter how many rows it has.",
    watch: "Degree counts columns. The number of rows is called the cardinality of the relation." },
  { term: "Domain", def: "The named set of all values an attribute is allowed to hold.",
    more: "A domain describes both the data type and its meaning, such as \"two-letter state codes\" or \"whole numbers from 1 to 5\". Two attributes can share a domain." },
  { term: "Primary key", def: "The column, or set of columns, whose value uniquely identifies each row in a table.",
    more: "A primary key can never be NULL and can never repeat. Every table should have one, because it is how other tables refer to a specific row.",
    ex: "StudentNumber in the Student table." },
  { term: "Foreign key", def: "A column in one table that holds the primary key value of a row in another (or the same) table, creating a link between them.",
    more: "Foreign key values may repeat (many orders can belong to one customer) and may be NULL unless the column is declared NOT NULL. But any value that is not NULL must match an existing primary key value in the referenced table.",
    ex: "Orders.CustomerID refers to Customers.CustomerID." },
  { term: "Referential integrity", def: "The rule that every non-NULL foreign key value must match an existing primary key value.",
    more: "It prevents \"orphan\" rows that point at nothing. The rule can be broken by inserting a child row with an unknown parent, by changing a parent's key, or by deleting a parent that still has children. Deleting a child row (the row that contains the foreign key) can never break it." },
  { term: "Enterprise constraints", def: "Additional rules defined by users or database administrators, which can involve several tables. Also called semantic constraints or business rules.",
    more: "They sit alongside the built-in integrity rules (entity, domain and referential). They describe the organization's own policies, such as limits and business rules.",
    ex: "A class can have at most 30 students. A teacher teaches at most four classes per semester. An employee's salary can't exceed their manager's." },
  { term: "Referential actions", def: "What the database does to child rows when a referenced parent row is deleted or its key is changed.",
    more: "RESTRICT (the default when nothing is specified) rejects the change. CASCADE applies the change to the children too (deleting the parent deletes its children). SET NULL sets the children's foreign key to NULL. SET DEFAULT sets it to the column's default value.",
    watch: "SET NULL is impossible when the foreign key column is declared NOT NULL." },
  { term: "NULL", def: "A special marker meaning a value is unknown, missing or does not apply. It is not zero and not an empty string.",
    more: "Because NULL means \"unknown\", comparisons with it return NULL (unknown) instead of true or false. TRUE AND NULL is NULL, FALSE AND NULL is FALSE, TRUE OR NULL is TRUE. To test for it, use IS NULL or IS NOT NULL.",
    watch: "WHERE phone = NULL never matches anything. Write WHERE phone IS NULL." },
  { term: "Aggregate functions and NULL", def: "SUM, AVG, MIN, MAX and COUNT(column) skip NULL values.",
    more: "AVG divides by the number of non-NULL values, not by the number of rows. COUNT(*) is the exception: it counts rows, including rows with NULLs." }
],
/* 3 · Grassy Dunes · SQL Part 1: defining and changing data */
[
  { term: "Data definition statements", def: "Statements that create or change the structure of the database: CREATE, ALTER and DROP.",
    more: "They work on tables, columns, constraints and whole databases, not on the rows inside them." },
  { term: "Data manipulation statements", def: "Statements that work with the rows inside tables: INSERT, UPDATE, DELETE and SELECT.",
    more: "INSERT adds rows, UPDATE changes values in existing rows, DELETE removes rows, and SELECT reads them." },
  { term: "Schema", def: "The structure of a database: its tables, columns, types and constraints. In MySQL, \"schema\" is simply another word for \"database\".",
    more: "CREATE SCHEMA shop; and CREATE DATABASE shop; do the same thing in MySQL. USE shop; tells MySQL that the statements that follow apply to that database." },
  { term: "Data types", def: "The kind of value a column holds, which controls what can be stored and how much space it uses.",
    more: "INT holds whole numbers; DECIMAL(8,2) holds exact numbers with 2 digits after the decimal point (good for money); VARCHAR(50) holds text up to 50 characters; DATE holds a calendar date. A signed number may be negative; UNSIGNED allows only zero and positive values, which doubles the largest positive value." },
  { term: "AUTO_INCREMENT", def: "A MySQL column option that automatically gives each new row the next number.",
    more: "It is usually used on a surrogate primary key, so you never have to pick an identifying number yourself. Leave the column out of the INSERT and MySQL fills it in." },
  { term: "Constraint", def: "A rule the database enforces on the data so that invalid values are rejected.",
    more: "NOT NULL requires a value. UNIQUE forbids duplicates. PRIMARY KEY is unique and not NULL. FOREIGN KEY enforces referential integrity. CHECK limits values with an expression, such as CHECK (price >= 0). DEFAULT supplies a value when none is given; without a default, a column left out of an INSERT becomes NULL." },
  { term: "Column-level and table-level constraints", def: "A column-level constraint is written next to one column; a table-level constraint is written separately and can cover several columns.",
    more: "A rule that involves more than one column must be table-level.",
    ex: "UNIQUE (first_name, last_name, birth_date) is a table-level constraint: the combination must be unique, though each column alone may repeat." },
  { term: "DROP TABLE and foreign keys", def: "You cannot drop a table while another table's foreign key still refers to it.",
    more: "Dropping it would leave the child rows pointing at nothing, which breaks referential integrity. Drop the child table (or its foreign key) first." },
  { term: "UPDATE and DELETE need WHERE", def: "WHERE chooses which rows an UPDATE or DELETE affects; without it, every row in the table is changed or removed.",
    more: "Before running an UPDATE or DELETE, run a SELECT with the same WHERE to see exactly which rows will be affected.",
    ex: "DELETE FROM rental WHERE rental_id = 17; deletes one row. DELETE FROM rental; deletes all of them." }
],
/* 4 · Crystal Caves · SQL Part 2: SELECT and joins */
[
  { term: "SELECT ... FROM ... WHERE", def: "The basic query: FROM names the table, WHERE keeps only the rows that pass a condition, and SELECT picks the columns to show.",
    more: "The full clause order and how GROUP BY, HAVING, ORDER BY and LIMIT fit in is explained step by step in the \"Grouping & sorting\" tab." },
  { term: "LIKE and wildcards", def: "LIKE compares text to a pattern. % matches any number of characters (including none); _ matches exactly one character.",
    ex: "LIKE 'L_t' matches Lot, Lit and Let but not Light. LIKE 'L%' matches anything starting with L." },
  { term: "Aggregate function", def: "A function that turns many rows into one value: COUNT, SUM, AVG, MIN and MAX.",
    more: "With no GROUP BY, an aggregate summarizes the whole result into one row. With GROUP BY, it produces one value per group. SUM returns NULL (not 0) when no rows match. MIN and MAX work on text too, using alphabetical order." },
  { term: "COUNT(*), COUNT(column), COUNT(DISTINCT column)", def: "COUNT(*) counts rows; COUNT(column) counts non-NULL values in that column; COUNT(DISTINCT column) counts different non-NULL values.",
    ex: "If 5 rentals were made by 3 customers, COUNT(*) is 5 and COUNT(DISTINCT customer_id) is 3." },
  { term: "DISTINCT", def: "Removes duplicate rows from the result.",
    more: "SELECT DISTINCT city FROM customer lists each city once, no matter how many customers live there." },
  { term: "COALESCE", def: "Returns the first value in its list that is not NULL.",
    ex: "COALESCE(mobile, home_phone, 'no phone') shows the mobile number if there is one, otherwise the home phone, otherwise the text 'no phone'." },
  { term: "STRCMP", def: "A MySQL function that compares two strings: it returns 0 if they are equal, -1 if the first sorts before the second, and 1 if it sorts after." },
  { term: "JOIN ... USING", def: "USING (column) joins two tables on a column that has the same name in both, matching it for equality.",
    more: "It is a shorter way to write ON a.column = b.column, and the shared column appears only once in the result. NATURAL JOIN is different: it matches every column with the same name, which can include ones you didn't mean, like last_update.",
    ex: "SELECT * FROM customer JOIN payment USING (customer_id);" },
  { term: "IN() lists", def: "IN checks whether a value appears in a list: WHERE rating IN ('G', 'PG').",
    more: "Don't mix quoted and unquoted values in one list. Strings and numbers are compared by different rules, so a mixed list like IN (1, 2, 'a') can give inconsistent results. Write IN ('1', '2', 'a') instead.",
    watch: "In MySQL, 'a' IN (0) returns true, because 'a' is converted to the number 0." },
  { term: "ORDER BY column positions", def: "ORDER BY 2 sorts by the second column in the SELECT list.",
    more: "MySQL still accepts it, but column positions are deprecated because the syntax was removed from the SQL standard. They also break silently if someone reorders the SELECT list. Sort by a column name or alias instead." },
  { term: "Inner join", def: "Combines rows from two tables where the join condition matches, usually a foreign key equal to a primary key.",
    more: "Rows without a match in the other table are left out.",
    ex: "SELECT c.name, o.order_date FROM customer c JOIN orders o ON o.customer_id = c.customer_id;" },
  { term: "Left (outer) join", def: "Keeps every row from the left table, adding matching rows from the right table, and fills in NULL where there is no match.",
    more: "Use it to include things that have nothing related, such as customers who have never placed an order." },
  { term: "Cartesian product", def: "Every row of one table paired with every row of another, which is what happens when a join has no join condition.",
    more: "Two tables with 1,000 rows each produce 1,000,000 rows, almost all of them meaningless pairs. Always give a join an ON condition." },
  { term: "Self-join", def: "Joining a table to itself, for example to pair each employee with their manager from the same table.",
    more: "Aliases are required to tell the two copies apart.",
    ex: "FROM employee e JOIN employee m ON e.manager_id = m.employee_id" }
],
/* 5 · Glowshroom Forest · SQL Part 3: subqueries and views */
[
  { term: "Subquery", def: "A query written inside another query, in parentheses.",
    more: "It can supply a single value (WHERE length > (SELECT AVG(length) FROM film)), a list of values (WHERE id IN (SELECT ...)), or a whole temporary table (FROM (SELECT ...) AS t)." },
  { term: "Uncorrelated subquery", def: "A subquery that does not refer to the outer query, so it can run on its own.",
    more: "The database runs the inner query once, substitutes its result into the outer query, then runs the outer query." },
  { term: "Correlated subquery", def: "A subquery that refers to a column of the outer query, so it is re-run for each row of the outer query.",
    more: "Because it depends on the current outer row, it can't run on its own. Correlated subqueries are often used with EXISTS.",
    ex: "SELECT name FROM customer c WHERE EXISTS (SELECT 1 FROM rental r WHERE r.customer_id = c.customer_id);" },
  { term: "EXISTS", def: "A test that is TRUE when its subquery returns at least one row, and FALSE when it returns none.",
    more: "It only checks whether rows exist; the columns the subquery selects don't matter. NOT EXISTS finds rows with no related rows, such as customers who have never rented." },
  { term: "IN with a subquery", def: "Checks whether a value appears in the list that the subquery returns.",
    ex: "WHERE film_id IN (SELECT film_id FROM inventory WHERE store_id = 2)" },
  { term: "Derived table", def: "A subquery used in the FROM clause as if it were a table.",
    more: "It must be given an alias, because the outer query needs a name to refer to it.",
    ex: "SELECT AVG(total) FROM (SELECT customer_id, SUM(amount) AS total FROM payment GROUP BY customer_id) AS t;" },
  { term: "View names", def: "Views and base tables share one namespace in a database, so a view can't have the same name as a table.",
    more: "A view's column names must be unique. By default they are the column names from its SELECT; to rename them, give a column list: CREATE VIEW v (a, b) AS SELECT …" },
  { term: "View", def: "A saved SELECT statement with a name, which can be queried as if it were a table.",
    more: "A view normally stores no data of its own; each time you query it, its SELECT runs against the current data. Views hide complexity, give users only the columns they should see, and keep frequently used queries in one place. If you don't name a view's columns, they take the names of the columns in its query." },
  { term: "Building complex queries", def: "Break the problem into simple queries, test each, then combine them one step at a time.",
    more: "Write the inner part first and check its result, then wrap it in the outer query. Naming a step with a view helps." }
],
/* 6 · Wreck Field · Data Modeling */
[
  { term: "Data model", def: "A simplified picture of the data an organization needs: the things it tracks, their properties and how they relate.",
    more: "It is built before the database so designers and users can agree on what will be stored." },
  { term: "Levels of data abstraction", def: "From highest to lowest: external, conceptual, internal and physical.",
    more: "External is what each user group sees. Conceptual is the whole organization's data in one model, independent of any software. Internal is that model mapped to a specific kind of database management system (for example, relational tables). Physical is how the data is actually stored on disk: files, indexes and storage details." },
  { term: "Data independence", def: "Being able to change one level of the design without changing the levels above it.",
    more: "Physical data independence: changing indexes or storage without changing application logic. Logical data independence: changing the conceptual model (for example, adding a table) without rewriting the external views users depend on." },
  { term: "Entity", def: "A person, place, thing or event the organization needs to store data about.",
    more: "In written requirements, entities usually appear as nouns: customer, vehicle, appointment. Each entity becomes a table later." },
  { term: "Kinds of attributes", def: "Simple or composite, single-valued or multivalued, stored or derived.",
    more: "A composite attribute can be split into parts (an address into street, city, state, zip code). A multivalued attribute can hold several values (a person's skills). A derived attribute is calculated from others (age from birth date) and is drawn as a dashed ellipse. Details about an attribute's domain are not shown on the diagram." },
  { term: "Entity-relationship diagram", def: "A drawing of the data model showing entities, their attributes and the relationships between them.",
    more: "Its purpose is to communicate the design clearly before any tables are built." },
  { term: "Cardinality", def: "How many instances of one entity can be related to one instance of another: one or many, and whether at least one is required.",
    more: "Maximum cardinality (one or many) is the outer marking on the relationship line. Minimum cardinality (zero or one) is the inner marking. Zero means the relationship is optional.",
    ex: "In crow's foot notation, a circle plus three prongs means \"zero or many\"; two bars mean \"exactly one\"." },
  { term: "Independent entity (kernel)", def: "An entity that can exist on its own without depending on any other entity.",
    more: "Customer and Product are typically independent." },
  { term: "Weak entity and existence dependency", def: "A weak entity can't exist without the entity it depends on; this is called existence dependency.",
    more: "Existence dependency means the weak entity's table will have a mandatory (NOT NULL) foreign key to its owner. If the foreign key is also part of the weak entity's primary key, the relationship is called identifying.",
    ex: "An order line can't exist without its order." },
  { term: "Design phases", def: "Conceptual design (what data is needed), logical design (turning it into tables, keys and relationships), physical design (storage, data types and indexes).",
    watch: "Indexes are added in physical design, not earlier." }
],
/* 7 · Thermal Vents · Entity-relationship to relational model */
[
  { term: "Why convert the diagram to tables", def: "A relational database management system can only store tables, so the entity-relationship design has to be translated into relations, keys and constraints before it can be built." },
  { term: "Entities and attributes", def: "Each regular entity becomes a table; each simple attribute becomes a column; the identifier becomes the primary key.",
    more: "A composite attribute is split into one column per part. A derived attribute is usually not stored, because it can be calculated." },
  { term: "One-to-many relationship", def: "Put the primary key of the \"one\" side into the \"many\" side's table as a foreign key.",
    ex: "One customer has many orders, so Orders gets a CustomerID foreign key." },
  { term: "Many-to-many relationship", def: "Create a new table (often called a bridge or associative table) whose primary key combines the primary keys of both sides, each also a foreign key.",
    more: "Any attributes of the relationship itself, such as quantity or date, go in this new table.",
    ex: "Enrolls(StudentNumber, CourseNumber, Grade), with primary key (StudentNumber, CourseNumber)." },
  { term: "One-to-one relationship", def: "Put one side's primary key in the other table as a foreign key, and give that foreign key a UNIQUE constraint.",
    more: "Without UNIQUE, many rows could point to the same parent, which would make it one-to-many. Put the foreign key on the side with total participation if there is one. Two entities with partial participation on both sides can't be merged into one table, because no column would always be filled in." },
  { term: "Total participation", def: "Every instance of an entity must take part in the relationship (drawn as a double line).",
    more: "On the foreign key side, total participation becomes a NOT NULL foreign key." },
  { term: "Weak entities and identifying relationships", def: "A weak entity's table includes its owner's primary key as a foreign key, and that foreign key is part of the weak entity's own primary key.",
    ex: "OrderLine(OrderNumber, LineNumber, ProductID, Quantity) with primary key (OrderNumber, LineNumber)." },
  { term: "Multivalued attribute", def: "Becomes its own table containing the owner's primary key plus the attribute, and both together form the primary key.",
    ex: "Employee skills become EmployeeSkill(EmployeeID, Skill)." },
  { term: "Supertypes and subtypes", def: "Each subtype table uses the same primary key as the supertype, and that key is also a foreign key to the supertype table.",
    ex: "Vehicle(VehicleNumber, Make, Model) with subtypes Car(VehicleNumber, Doors) and Truck(VehicleNumber, Payload)." }
],
/* 8 · Abyssal Trench · Normalization */
[
  { term: "Normalization", def: "The process of organizing tables to remove redundancy and the anomalies it causes, by splitting tables so each fact is stored once.",
    more: "It works through a series of normal forms, each stricter than the last. Each form fixes one kind of problem dependency." },
  { term: "Anomalies", def: "Problems caused by redundancy when changing data.",
    more: "An update anomaly: a fact stored in many rows must be changed in all of them, or the data disagrees. An insertion anomaly: you can't add one fact without also inventing another (you can't add a new course until a student enrolls). A deletion anomaly: deleting one fact accidentally deletes another (removing the last student in a course erases the course)." },
  { term: "Functional dependency", def: "X → Y means each value of X determines exactly one value of Y.",
    more: "If you know X, you know Y. X is called the determinant. A dependency must be true for every possible row, not just the current data.",
    ex: "StudentNumber → StudentName. But PassengerName → PassengerNumber is false, because two passengers can share a name." },
  { term: "Superkey and candidate key", def: "A superkey is any set of columns that uniquely identifies a row. A candidate key is a minimal superkey: removing any column would stop it from being unique.",
    more: "The primary key is the candidate key the designer chooses. The others are called alternate keys." },
  { term: "First normal form", def: "Every field holds one atomic value, and there are no repeating groups.",
    ex: "A Phone column holding \"704-555-1111, 980-555-2222\" breaks first normal form. Move phones to their own table, one row per number." },
  { term: "Second normal form", def: "First normal form, plus no partial dependencies: every non-key column depends on the whole primary key, not just part of it.",
    more: "Partial dependencies can only happen when the primary key has more than one column. So a first normal form table with a single-column primary key is automatically in second normal form.",
    ex: "In Enrolls(StudentNumber, CourseNumber, StudentName, Grade), StudentName depends only on StudentNumber. Move it to the Student table." },
  { term: "Third normal form", def: "Second normal form, plus no transitive dependencies: no non-key column depends on another non-key column.",
    ex: "User(UserID, Email, Zip, City, State): Zip → City and State. Split into User(UserID, Email, Zip) and ZipCode(Zip, City, State)." },
  { term: "Boyce-Codd normal form", def: "Every determinant is a superkey: whenever X → Y holds, X must uniquely identify the row.",
    more: "It is a stricter version of third normal form. It catches dependencies where part of a key is determined by a non-key column, or where a column determines part of the key.",
    ex: "Old(A, B, D) with key (A, B, D), plus A → C. A is not a superkey, so move C out: Old(A, B, D) and New(A, C) with key A." },
  { term: "Decomposition", def: "Splitting a table into smaller tables to reach a higher normal form.",
    more: "A good decomposition is lossless: joining the pieces back together on their shared column gives exactly the original rows, with nothing extra and nothing missing. The determinant becomes the primary key of the new table and stays behind as a foreign key." }
]
];

/* Exam 1 study-guide additions to the Databank, zone by zone. */
const GUIDE_EXTRA = [
/* 1 · Intro */
[
  { term: "Attribute", def: "A property that describes something the database tracks, such as a customer's name or email.",
    more: "Attributes are what the data is about: each piece of data is the value of some attribute for some thing. In a table, each attribute becomes a column." },
  { term: "Collections of data (the data hierarchy)", def: "Data is grouped into larger and larger collections: field → record → table (file) → database.",
    more: "A field holds one fact. A record collects the fields about one thing. A table (called a file in older systems) collects records of the same kind. A database collects related tables and manages them as one unit." },
  { term: "Metadata and the data dictionary", def: "Metadata is data about data: table names, column names, data types, constraints and permissions. The database management system keeps it in the data dictionary (also called the system catalog).",
    more: "Because the structure is stored inside the database itself, the database is self-describing. Programs ask the catalog what the data looks like instead of hard-coding it." },
  { term: "Role of databases in business", def: "Businesses use databases to run daily operations and to make decisions.",
    more: "Operations: recording sales, orders, payments, inventory and customer accounts as they happen (transactions). Decisions: turning that stored data into information through queries and reports, such as which products sell best or which customers have stopped buying. Almost every business application (websites, payroll, point of sale) sits on top of a database." },
  { term: "Relational database management system", def: "A database management system that stores data in tables (relations) and is queried with SQL. Examples: MySQL, Oracle, SQL Server and PostgreSQL.",

  { term: "Database system", def: "The whole working setup: the database, the database management system, the application programs and the people who use them.",
    watch: "Database (the data), database management system (the software) and database system (everything together) are three different terms." },
  { term: "Characteristics of the database approach", def: "Self-describing (metadata in the catalog), insulation between programs and data, support for multiple views, and sharing among many users at once.",

  { term: "Advantages of the database approach", def: "Controlled redundancy, consistent data, data sharing, enforced standards, central security, integrity rules, concurrency control, and backup and recovery.",
    more: "Each one fixes a problem of file-based systems: redundancy and inconsistency, isolation, scattered integrity and security rules, and whole-file locking." }
],
/* 2 · Relational */
[
  { term: "Set", def: "A collection of distinct items with no order. A relation is a set of rows.",
    more: "Because a relation is a set, it can't contain two identical rows, and the order of its rows doesn't matter. (SQL tables can hold duplicates unless a key prevents them, which is one reason every table needs a primary key.)" },
  { term: "Data type", def: "The format a value is stored in, such as INT, DECIMAL, VARCHAR or DATE.",
    more: "A data type says how a value is stored. A domain goes further and says what the value means and which values are allowed. Age and Quantity might both be INT, but they have different domains." },
  { term: "Three-valued logic", def: "Because of NULL, a condition can be TRUE, FALSE or NULL (unknown).",

    watch: "NOT doesn't rescue an unknown: NOT (NULL) is still NULL." },
  { term: "Operators", def: "Comparison operators (=, <>, <, >, <=, >=) compare values; logical operators (AND, OR, NOT) combine conditions; arithmetic operators (+, -, *, /) calculate.",
    more: "The full MySQL list, with examples, is in the Crystal Caves section." },
  { term: "Select (σ)", def: "A relational operation that keeps only the rows that satisfy a condition.",
    more: "It's the WHERE clause in SQL. The result has the same columns as the input.",
    ex: "σ Major = 'IS' (Student) keeps only students majoring in IS." },
  { term: "Project (π)", def: "A relational operation that keeps only the listed columns and removes duplicate rows.",

    ex: "π Name, Major (Student)" },
  { term: "Product (×)", def: "Pairs every row of one table with every row of another.",
    more: "The result has (rows of R × rows of S) rows and (columns of R + columns of S) columns. On its own it is rarely useful; it's the first step of a join.",
    ex: "3 rows × 4 rows = 12 rows." },
  { term: "Join (⋈)", def: "A product followed by a select that keeps only the pairs where the join condition is true, usually a foreign key equal to a primary key.",

  { term: "Union, intersect and difference", def: "Union returns rows in either table; intersect returns rows in both; difference (R − S) returns rows in R but not in S.",
    more: "All three require the tables to be union-compatible: the same number of columns, with compatible domains in the same order. Union and intersect are commutative; difference is not (R − S ≠ S − R). SQL's UNION removes duplicates; UNION ALL keeps them." },
  { term: "Entity integrity", def: "No part of a primary key may be NULL, and no two rows may share a primary key value.",

  { term: "Domain integrity and enterprise constraints", def: "Domain integrity: every value must come from its column's domain. Enterprise (business) constraints: rules that come from how the organization works.",
    more: "Domain integrity is enforced with data types, NOT NULL, CHECK and DEFAULT. Enterprise constraints include things like 'a class can't have more than 30 students' or 'ship date can't be before order date'." },
  { term: "RDBMS architecture", def: "The main parts of a relational database management system: the query processor, the storage manager and the stored data (data files, indexes and the data dictionary).",

  { term: "SQL sublanguages", def: "Data definition statements (CREATE, ALTER, DROP) build structure; data manipulation statements (SELECT, INSERT, UPDATE, DELETE) work with rows.",

  { term: "CREATE", def: "Creates a database, table or view.",

[
  { term: "Comparison operators", def: "=, <> (or !=), <, >, <=, >=, plus BETWEEN, IN, LIKE, IS NULL and the NULL-safe <=>.",
    more: "Each returns 1 (true), 0 (false) or NULL. <=> works like = but treats two NULLs as equal: NULL <=> NULL is 1, while NULL = NULL is NULL. IN (list) is a shortcut for several ORs. NOT IN, NOT BETWEEN and NOT LIKE reverse them.",

  { term: "Comparison subqueries (ANY, SOME, ALL)", def: "Compare a value against every value a subquery returns.",
    more: "x > ANY (…) is true if x beats at least one value (the minimum). x > ALL (…) is true if x beats every value (the maximum). SOME means the same as ANY. = ANY is the same as IN, and <> ALL is the same as NOT IN.",

/* 6 · Data modeling */
[
  { term: "Relational database design", def: "Moving from requirements to a working database: gather requirements, build a conceptual model (entity-relationship), turn it into tables (logical design), normalize, then choose storage and indexes (physical design)." },
  { term: "Building an entity-relationship model through analysis", def: "Read the requirements, then identify entities, relationships, attributes and keys, and set cardinalities. Repeat until the model fits every requirement.",
    more: "Nouns usually become entities or attributes; verbs usually become relationships. Ask of each noun: does it have its own data and need to be identified? If yes, it's an entity; if it just describes something, it's an attribute. Business rules become cardinalities and constraints." },
  { term: "Classification of database management systems", def: "By data model (hierarchical, network, relational, object-oriented), by number of users (single-user, multiuser) and by distribution (centralized, distributed).",
    more: "Hierarchical: records form a tree, each child has one parent. Network: a record can have several parents. Relational: tables linked by keys. Object-oriented: data stored as objects with methods. A distributed database is homogeneous if every site runs the same software, heterogeneous if not." },
  { term: "Entity types (kernels, dependents, characteristics)", def: "Independent entities (kernels) exist on their own; dependent entities rely on others; characteristic entities describe another entity.",
    more: "A composite (associative) entity is a dependent entity that resolves a many-to-many relationship, such as Enrollment between Student and Course. A characteristic entity holds extra detail about one entity, often a multivalued attribute such as an employee's phone numbers." },
  { term: "Degree of a relationship", def: "The number of entity types that take part: unary (recursive, one entity), binary (two) or ternary (three).",
    ex: "Unary: Employee manages Employee. Binary: Customer places Order. Ternary: Supplier supplies Part to Project." },
  { term: "Relationship types by cardinality", def: "One-to-one (1:1), one-to-many (1:N), many-to-one (N:1) and many-to-many (M:N).",
    more: "Many-to-many relationships can't be built directly in tables, so they are resolved with an associative entity." },
  { term: "Integrity constraints in the model", def: "Keys (every entity has an identifier), cardinality and participation (minimums and maximums on relationships), and business rules.",
    more: "These carry over into the tables as PRIMARY KEY, FOREIGN KEY, NOT NULL, UNIQUE and CHECK." },
  { term: "Supertypes and subtypes", def: "A supertype holds attributes shared by all its kinds; each subtype adds attributes that apply only to it, and inherits everything from the supertype.",
    more: "Disjoint: an instance belongs to at most one subtype (a vehicle is a car or a truck). Overlapping: it can belong to several (a person who is both a student and an employee). Total (complete): every instance must be in some subtype. Partial: some may be in none. A subtype discriminator is a supertype attribute, such as VehicleType, that says which subtype a row belongs to.",
    ex: "Vehicle(VehicleNumber, Make, Model) with Car(Doors) and Truck(Payload)." },
  { term: "Diagram notation", def: "Chen notation draws entities as rectangles, relationships as diamonds and attributes as ellipses; crow's foot notation puts attributes inside the entity boxes and shows cardinality on the line ends.",
    more: "Chen: an underlined attribute is a key, a double ellipse is multivalued, a dashed ellipse is derived, a double rectangle is a weak entity and a double diamond is its identifying relationship." }
],
/* 7 · ER to relational */
[
  { term: "Relational schema", def: "A written list of tables in the form TABLE(Column1, Column2, …), with the primary key underlined and foreign keys marked.",
    ex: "EMPLOYEE(EmpID, Name, DeptID) with DeptID a foreign key to DEPARTMENT(DeptID, DeptName)." },
  { term: "Many-to-one relationship", def: "Exactly the same as one-to-many, read from the other side: the foreign key goes in the table on the many side.",
    ex: "Many employees work in one department: DeptID goes in EMPLOYEE." },
  { term: "Attributes of relationships", def: "In 1:N, they go in the many side's table; in M:N, they go in the bridge table; in 1:1, they go with the foreign key.",
    ex: "HireDate on Department–Employee goes in EMPLOYEE. Grade on Student–Course goes in ENROLLS." },
  { term: "Recursive and ternary relationships", def: "A recursive 1:N adds a foreign key that points to the same table; a recursive M:N or a ternary relationship becomes its own table.",
    ex: "EMPLOYEE(EmpID, Name, SupervisorID). PREREQ(CourseID, PrereqID). SUPPLIES(SupplierID, PartID, ProjectID)." },
  { term: "Normalizing and merging tables", def: "After mapping, check each table's normal form, and merge tables that always go together.",
    more: "A 1:1 relationship with total participation on both sides can be merged into one table. Don't merge when either side is optional, because the merged table would be full of NULLs and no key would always be filled in." },
  { term: "Kinds of keys", def: "Candidate key: any minimal set of columns that uniquely identifies a row. Primary key: the candidate key chosen. Alternate (secondary) key: the other candidates. Composite key: a key of two or more columns. Surrogate key: a generated number with no business meaning. Natural key: real-world data like an ISBN.",
    watch: "Surrogate keys never change; natural keys can, which forces updates to every foreign key that copies them." },
  { term: "Mapping supertypes and subtypes", def: "Three options: one table for the supertype plus one per subtype (sharing the primary key), one table per subtype only, or a single table for everything with a discriminator column.",
    more: "The first option fits most cases. A single table is simplest but leaves NULLs in subtype columns that don't apply." }
],
/* 8 · Normalization */
[
  { term: "Reasons for normalization", def: "To remove redundancy so each fact is stored once, which prevents update, insertion and deletion anomalies and keeps the data consistent.",
    more: "It also makes the design easier to understand and change. The trade-off is more tables and more joins." },
  { term: "Armstrong's axioms", def: "Three rules for deriving new functional dependencies: reflexivity, augmentation and transitivity.",
    more: "Reflexivity: if Y is part of X, then X → Y (a trivial dependency). Augmentation: if X → Y, then XZ → YZ. Transitivity: if X → Y and Y → Z, then X → Z. These three are sound and complete: they derive only true dependencies, and every true one." },
  { term: "Derived inference rules", def: "Union, decomposition and pseudotransitivity, which follow from Armstrong's axioms.",
    more: "Union: if X → Y and X → Z, then X → YZ. Decomposition: if X → YZ, then X → Y and X → Z. Pseudotransitivity: if X → Y and WY → Z, then WX → Z." },
  { term: "Closure of a set of dependencies (F+)", def: "The set of every functional dependency that can be inferred from F by applying the inference rules repeatedly.",
    more: "F+ includes the transitive dependencies hidden inside F: if F has A → B and B → C, then F+ also has A → C. Listing F+ in full is huge, so in practice we compute attribute closures instead." },
  { term: "Attribute closure (X+)", def: "Every attribute that X determines, directly or through a chain of dependencies.",
    more: "Start with X. Repeatedly look for a dependency whose whole left side is already in the set, and add its right side. Stop when nothing new is added. If X+ contains every attribute, X is a superkey; if no smaller part of X also does, X is a candidate key.",
    ex: "R(A, B, C, D, E), F = {A → B, B → C, CD → E}. {A}+ = {A, B, C}. {A, D}+ = {A, B, C, D, E}, so AD is a candidate key." },
  { term: "Trivial and full functional dependencies", def: "Trivial: the right side is part of the left, like AB → A. Full: the right side depends on the whole left side and not on any part of it.",
    more: "Second normal form requires every non-key column to be fully dependent on the primary key." },
  { term: "Unnormalized form", def: "A table with repeating groups or multivalued fields, before first normal form.",
    ex: "Order(OrderNo, Date, Product1, Qty1, Product2, Qty2, …)" },
  { term: "Fourth and fifth normal forms", def: "4NF: BCNF with no multivalued dependencies. 5NF: no join dependencies.",
    more: "A multivalued dependency happens when one table stores two independent lists about the same thing, such as an employee's skills and languages; every combination has to be stored. Split them into two tables. 5NF covers rare cases where a table can only be rebuilt by joining three or more smaller tables." },
  { term: "The normalization process", def: "Unnormalized → 1NF (remove repeating groups) → 2NF (remove partial dependencies) → 3NF (remove transitive dependencies) → BCNF (every determinant a superkey).",
    more: "At each step, find the dependency that breaks the form, move the determinant and what it determines into a new table, and leave the determinant behind as a foreign key." },
  { term: "Denormalization", def: "Deliberately adding some redundancy back, usually to make frequent reads faster with fewer joins.",
    watch: "It brings back the risk of anomalies, so it's a deliberate trade-off, not a design default." }
]
];

/* ---------- Worked walkthrough: GROUP BY, HAVING, ORDER BY, LIMIT ---------- */
const RENTAL = { cols: ["rental_id", "customer", "genre", "price"], rows: [
  [1, "Ana", "Comedy", 3], [2, "Ben", "Horror", 4], [3, "Ana", "Horror", 4], [4, "Cy", "Comedy", 3],
  [5, "Ana", "Drama", 5], [6, "Ben", "Comedy", 3], [7, "Dee", "Drama", 5], [8, "Cy", "Horror", 4] ] };

const SQL_DEEP = {

    ["HAVING", "Throw away whole groups that fail the condition."],
    ["SELECT", "Choose the columns and name them (aliases are created here)."],
    ["ORDER BY", "Sort the final rows."],
    ["LIMIT", "Keep only the first few rows."]
  ],

  sections: [

      result: { cols: ["customer", "rentals", "spent"], rows: [["Ana", 3, 12], ["Ben", 2, 7], ["Cy", 2, 7], ["Dee", 1, 5]] },
      watch: [

  together: {
