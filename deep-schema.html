<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Schema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: full-screen Phaser ocean with a diving HUD on top and a glass "PDA" sheet at the bottom. Single committed deep-sea dark look. */
:root {
  --abyss: #021018;
  --glass: rgba(4, 22, 34, 0.95);
  --glass-edge: rgba(110, 230, 220, 0.28);
  --ink: #e4f6f8;
  --muted: #8db5bd;
  --aqua: #5eead4;       /* scanner / HUD accent */
  --gold: #ffcf6b;       /* salvage currency */
  --danger: #ff6b57;     /* oxygen loss, creatures */
  --good: #7ef0a8;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--abyss); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; overflow: hidden; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; }

/* HUD */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  background: linear-gradient(rgba(2,16,24,0.75), rgba(2,16,24,0));
  pointer-events: none;
}
.hud .loc { min-width: 0; }
.hud .zone { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .depth { font-family: var(--mono); font-weight: 700; font-size: 1.25rem; color: var(--aqua); font-variant-numeric: tabular-nums; }
.o2 { display: grid; gap: 3px; max-width: 260px; justify-self: center; width: 100%; }
.o2 .lbl { display: flex; justify-content: space-between; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.o2 .bar { height: 9px; border: 1px solid var(--glass-edge); background: rgba(2,16,24,0.7); border-radius: 5px; overflow: hidden; }
.o2 .fill { height: 100%; background: linear-gradient(90deg, #2bb8c9, var(--aqua)); transition: width .35s ease, background .3s; border-radius: 5px; }
.o2.low .fill { background: linear-gradient(90deg, #c2412f, var(--danger)); }
.o2.low .lbl span:last-child { color: var(--danger); }
.cash { text-align: right; }
.cash .amt { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.cash .sub { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* PDA sheet */
.sheet {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 4;
  width: min(600px, 100%); max-height: 56vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--glass); border: 1px solid var(--glass-edge); border-bottom: 0;
  border-radius: 18px 18px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.45);
}
@media (min-width: 900px) { .sheet { max-height: 62vh; } }
.grip { width: 42px; height: 4px; border-radius: 2px; background: var(--glass-edge); margin: -4px auto 10px; }
.kicker { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--aqua); font-weight: 600; }
.kicker.red { color: var(--danger); }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; margin: 2px 0 6px; text-wrap: balance; }
.sheet p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.q { font-weight: 600; font-size: 1.07rem; margin: 4px 0 12px; text-wrap: pretty; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 12px; }
.tab { font: 600 0.8rem var(--display); letter-spacing: 0.04em; text-transform: uppercase; padding: 9px 4px; border-radius: 10px; border: 1px solid var(--glass-edge); background: transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: rgba(94,234,212,0.14); color: var(--aqua); border-color: var(--aqua); }

.btn { font: 700 1.02rem var(--display); letter-spacing: 0.05em; text-transform: uppercase; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; background: var(--aqua); color: #03221f; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--glass-edge); }
.btn.warn { background: var(--danger); color: #2a0703; }
.btn.small { padding: 8px 12px; font-size: 0.85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.row .grow { flex: 1; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.opts { display: grid; gap: 8px; }
.opt { text-align: left; font: 500 0.98rem var(--body); color: var(--ink); background: rgba(94,234,212,0.06); border: 1px solid var(--glass-edge); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.opt .k { font: 700 0.85rem var(--mono); color: var(--aqua); padding-top: 2px; }
.opt.right { border-color: var(--good); background: rgba(126,240,168,0.12); }
.opt.wrong { border-color: var(--danger); background: rgba(255,107,87,0.12); }
.opt.gone { opacity: 0.25; text-decoration: line-through; }
.opt.dim { opacity: 0.5; }
.opt:disabled { cursor: default; }
.fb { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--glass-edge); background: rgba(2,16,24,0.6); }
.fb b { font-family: var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.fb.good b { color: var(--good); }
.fb.bad b { color: var(--danger); }
.fb p { margin: 2px 0 0; }

.zones { display: grid; gap: 8px; }
.zbtn { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--glass-edge); background: rgba(94,234,212,0.05); color: var(--ink); font: inherit; cursor: pointer; }
.zbtn:disabled { cursor: not-allowed; opacity: 0.55; }
.zbtn .zn { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.zbtn .zt { color: var(--muted); font-size: 0.86rem; grid-column: 1; }
.zbtn .zs { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; text-align: right; font-variant-numeric: tabular-nums; }
.zs.ok { color: var(--good); } .zs.lock { color: var(--danger); } .zs.go { color: var(--aqua); }

.shop { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--glass-edge); background: rgba(94,234,212,0.04); align-items: center; }
.item .in { font-weight: 700; }
.item .id { color: var(--muted); font-size: 0.86rem; grid-column: 1; }
.item .buy { grid-row: 1 / span 2; grid-column: 2; }
.price { font-family: var(--mono); color: var(--gold); }
.owned { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--good); }
.sect { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }

details.log { border: 1px solid var(--glass-edge); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; background: rgba(94,234,212,0.04); }
details.log summary { cursor: pointer; font-family: var(--display); font-weight: 700; }
details.log .entry { border-top: 1px solid rgba(110,230,220,0.15); padding: 8px 0; font-size: 0.92rem; }
details.log .entry .a { color: var(--aqua); }
.beast { border-left: 3px solid var(--danger); padding-left: 10px; margin: 6px 0 10px; }
.beast .bn { font-family: var(--display); font-weight: 700; color: var(--danger); }

/* sort + stack */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 36px; }
.chip { font: 500 0.9rem var(--body); color: var(--ink); background: rgba(94,234,212,0.08); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 6px 12px; cursor: pointer; text-align: left; }
.chip.sel { border-color: var(--gold); background: rgba(255,207,107,0.16); }
.chip.in { cursor: default; font-size: 0.8rem; padding: 3px 9px; border-color: rgba(126,240,168,0.5); }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.bin { text-align: left; font: inherit; color: var(--ink); border: 1px dashed var(--glass-edge); border-radius: 12px; padding: 8px; min-height: 80px; background: rgba(2,16,24,0.5); cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.bin.armed { border-style: solid; border-color: var(--gold); }
.bin .bt { font-family: var(--display); font-weight: 700; font-size: 0.95rem; }
.bin .bi { display: flex; flex-wrap: wrap; gap: 4px; }
.yard { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.blk { font: 500 0.85rem var(--mono); color: var(--ink); background: rgba(94,234,212,0.08); border: 1px solid var(--glass-edge); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.stack { background: rgba(0,8,12,0.7); border: 1px solid var(--glass-edge); border-radius: 12px; padding: 10px 12px; overflow-x: auto; }
.stack div { font: 500 0.85rem var(--mono); white-space: pre; color: var(--good); }
.stack .nx { color: var(--muted); }
.hp { display: flex; gap: 5px; margin: 4px 0 10px; }
.hp i { width: 26px; height: 8px; border-radius: 4px; background: var(--danger); }
.hp i.off { background: rgba(255,107,87,0.18); }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.toast { position: fixed; z-index: 6; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 6px 14px; font-weight: 600; pointer-events: none; transition: opacity .3s; white-space: nowrap; }
.toast.gold { color: var(--gold); } .toast.red { color: var(--danger); }
.coach { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 64px); width: min(560px, calc(100% - 24px)); background: #071b29; border: 1.5px solid var(--gold); border-radius: 14px; padding: 10px 14px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.55); }
.coach .who { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 700; display: flex; justify-content: space-between; }
.coach p { margin: 4px 0 0; font-size: 0.97rem; }
.coach .row { margin-top: 10px; }
.coach .skip { background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.8rem; text-decoration: underline; cursor: pointer; padding: 4px; }
.spot { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(255,207,107,0.55) !important; border-radius: 12px; animation: spot 1.4s ease-in-out infinite; }
@keyframes spot { 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 28px rgba(255,207,107,0.85) !important; } }
@media (prefers-reduced-motion: reduce) { .shake, .spot { animation: none; } }

/* Sub Bay */
.rec { border: 1px solid var(--glass-edge); border-radius: 12px; background: rgba(0,8,12,0.7); padding: 8px 10px; margin: 8px 0 10px; }
.rec .rq { font: 500 0.78rem var(--mono); color: var(--aqua); margin-bottom: 6px; overflow-x: auto; white-space: nowrap; }
.rec .rt { overflow-x: auto; }
.rec table { border-collapse: collapse; font: 500 0.78rem var(--mono); font-variant-numeric: tabular-nums; }
.rec th, .rec td { border: 1px solid rgba(110,230,220,0.22); padding: 3px 7px; text-align: center; white-space: nowrap; }
.rec th { color: var(--muted); font-weight: 500; }
.rec td { color: var(--gold); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.item.cos { cursor: pointer; }
.item.cos.pv { border-color: var(--gold); background: rgba(255,207,107,0.08); }
.qlog { background: rgba(0,8,12,0.7); border: 1px solid var(--glass-edge); border-radius: 12px; padding: 8px 10px; overflow-x: auto; }
.qlog div { font: 500 0.76rem var(--mono); color: var(--good); white-space: nowrap; }
.qlog div + div { color: var(--muted); }

/* ---------- Phaser version additions ---------- */
.small { font-size: 0.88rem; }
.sheet.bar { max-height: none; padding-top: 10px; }
.sheet.bar .grip { display: none; }
.objs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.obj { font: 600 0.8rem var(--display); letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--glass-edge); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
.obj.ok { color: var(--good); border-color: rgba(126,240,168,0.6); }
.near { margin-top: 8px; color: var(--gold); font-weight: 600; }
.keys { margin: 8px 0 0; }
.sheet .row:empty { display: none; }

/* thumb-stick + action buttons (touch) */
.stick { position: fixed; z-index: 4; left: 18px; bottom: calc(var(--bar, 0px) + 18px); width: 124px; height: 124px; border-radius: 50%; background: rgba(4,22,34,0.45); border: 2px solid var(--glass-edge); touch-action: none; }
.stick .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(94,234,212,0.55); border: 2px solid var(--aqua); pointer-events: none; }
.actbtn { position: fixed; z-index: 4; right: 18px; bottom: calc(var(--bar, 0px) + 30px); min-width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--gold); color: #2a1d00; font: 700 1rem var(--display); text-transform: uppercase; letter-spacing: 0.04em; box-shadow: 0 0 0 6px rgba(255,207,107,0.25); cursor: pointer; padding: 0 12px; }
.sonarbtn { position: fixed; z-index: 4; right: 26px; bottom: calc(var(--bar, 0px) + 140px); width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--aqua); background: rgba(4,22,34,0.7); color: var(--aqua); font: 700 0.75rem var(--display); text-transform: uppercase; cursor: pointer; }
.sonarbtn:disabled { opacity: 0.35; }

/* docked layout for wide screens: game on the left, PDA panel on the right */
body.docked #game { right: 420px; }
body.docked .hud { right: 420px; }
body.docked .sheet { left: auto; right: 0; top: 0; bottom: 0; transform: none; width: 420px; max-height: none; border-radius: 0; border-bottom: 1px solid var(--glass-edge); padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
body.docked .grip { display: none; }
body.docked .coach { left: 16px; transform: none; width: min(520px, calc(100% - 452px)); }
body.docked .toast { left: calc((100% - 420px) / 2); }

.qcode { font: 500 0.82rem var(--mono); line-height: 1.5; color: var(--good); background: rgba(0,8,12,0.7); border: 1px solid var(--glass-edge); border-radius: 10px; padding: 8px 10px; margin: -4px 0 12px; overflow-x: auto; white-space: pre; }
/* Focus mode: a question takes the middle of the screen over the dimmed game */
.focusdim { position: fixed; inset: 0; z-index: 3; background: rgba(1, 8, 14, 0.74); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.focusdim[hidden] { display: none; }
.sheet.focus, body.docked .sheet.focus { top: 50%; bottom: auto; left: 50%; right: auto; transform: translate(-50%, -50%); width: min(760px, calc(100% - 20px)); height: auto; max-height: calc(100% - 96px); border-radius: 18px; border: 1px solid var(--glass-edge); padding: 20px 22px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.sheet.focus .grip { display: none; }
.sheet.focus .q { font-size: 1.22rem; line-height: 1.4; margin: 6px 0 14px; }
.sheet.focus .opt { font-size: 1.02rem; padding: 13px 14px; }
@media (max-width: 600px) { .sheet.focus, body.docked .sheet.focus { padding: 16px 14px 18px; top: calc(50% + 24px); max-height: calc(100% - 84px); } .sheet.focus .q { font-size: 1.1rem; } }

/* Bloom level badge */
.qmeta { display: flex; gap: 8px; margin: 4px 0 2px; }
.bloom { font: 700 0.7rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.bloom.b1 { color: #9fd8ff; } .bloom.b2 { color: #7ef0a8; } .bloom.b3 { color: #ffcf6b; } .bloom.b4 { color: #ffa36b; } .bloom.b5 { color: #ff7aa8; } .bloom.b6 { color: #c49bff; }

/* Answer feedback */
.fb .fbrow { display: grid; grid-template-columns: 140px 1fr; gap: 10px; margin: 8px 0 0; }
.fb .lbl, .typed .lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
.fb .ans { color: var(--good); font-weight: 700; }
.fb .why { margin-top: 12px; line-height: 1.55; }
@media (max-width: 480px) { .fb .fbrow { grid-template-columns: 1fr; gap: 0; } }

/* Fill in the blank */
.blank { display: flex; gap: 8px; }
.blankin { flex: 1; min-width: 0; font: 600 1.05rem var(--mono); color: var(--ink); background: rgba(0,8,12,0.75); border: 1px solid var(--glass-edge); border-radius: 12px; padding: 12px 14px; }
.blankin:focus { outline: 2px solid var(--aqua); outline-offset: 1px; }
.hint { margin: 6px 0 0 !important; }
.typed { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid; font-family: var(--mono); }
.typed.right { border-color: var(--good); background: rgba(126,240,168,0.12); }
.typed.wrong { border-color: var(--danger); background: rgba(255,107,87,0.12); }

/* Level ladder */
.ladder { display: grid; gap: 6px; margin: 10px 0; }
.lvl { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--glass-edge); background: rgba(94,234,212,0.04); color: var(--ink); font: inherit; cursor: pointer; }
.lvl .ln { font: 700 1.1rem var(--mono); color: var(--aqua); text-align: center; }
.lvl .lt { display: grid; }
.lvl .lt .muted { font-size: 0.82rem; }
.lvl .ls { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.lvl.done .ls { color: var(--good); }
.lvl.top .ls { color: var(--gold); }
.lvl.pick { border-color: var(--gold); background: rgba(255,207,107,0.12); }
.lvl:disabled { opacity: 0.45; cursor: not-allowed; }
.offer { border: 1px solid var(--gold); border-radius: 14px; padding: 10px 12px; margin: 0 0 10px; background: rgba(255,207,107,0.08); }
.offer p { margin: 4px 0 0; }
.zl { color: var(--gold); }
.linkbtn { background: none; border: 0; color: var(--aqua); text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }
.misscount { font: 600 0.7rem var(--body); color: var(--danger); letter-spacing: 0.04em; margin-left: 6px; }
details.log .entry.miss { border-left: 3px solid var(--danger); padding-left: 10px; }
details.log .entry.miss .a { color: var(--good); }

/* Title screen */
.splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 30%, #0b4a63 0%, #04202f 55%, var(--abyss) 100%); }
.splash[hidden] { display: none; }
.splash-in { width: min(460px, 100%); text-align: center; }
.splash h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1; letter-spacing: 0.02em; margin: 8px 0 12px; color: var(--aqua); text-shadow: 0 0 28px rgba(94,234,212,0.35); }
.splash p { margin: 0 0 22px; }
.splash-btn { font-size: 1.2rem; padding: 15px 34px; }
.splash-err { margin: 18px 0 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--danger); background: rgba(255,107,87,0.12); color: #ffd2cb; text-align: left; font-size: 0.92rem; }
.splash-ver { margin: 22px 0 0 !important; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

/* Base raids */
body.raiding::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2; box-shadow: inset 0 0 90px rgba(255,60,40,0.55); animation: alarm 1.2s ease-in-out infinite; }
@keyframes alarm { 50% { box-shadow: inset 0 0 30px rgba(255,60,40,0.2); } }
@media (prefers-reduced-motion: reduce) { body.raiding::after { animation: none; } }
.raidbars { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 4px 0 8px; }
.raidbars > div { display: grid; gap: 2px; }
.raidbars .hp { margin: 0; }
.hp.shields i { background: var(--aqua); }
.hp.shields i.off { background: rgba(94,234,212,0.18); }
.raidwarn { font-family: var(--mono); color: var(--danger); font-size: 1.05rem; }
.raidwarn b { font-size: 1.45rem; font-variant-numeric: tabular-nums; }

/* Databank study guide */
.term { border-top: 1px solid rgba(110,230,220,0.15); padding: 10px 0; }

  { lv: 5, q: "A manager says, 'Our data is already in a database: it's a folder of 50 Excel files.' Evaluate the claim.", a: "Not a database: no shared structure or central control", w: ["A database, since the files all hold related data", "A database, as long as every file has headers", "Not a database, because Excel can't store numbers"], why: "A database is related data with a shared structure, managed as a unit by a DBMS that enforces rules, security and concurrency. A folder of independent files has none of that, even if the data is related." },
  { lv: 5, q: "Which is the best justification for the cost of a DBMS?", a: "It enforces integrity, security and recovery centrally", w: ["It makes every possible query run instantly, always", "It removes the need to design the data", "It lets each department keep its own format"], why: "The value of a DBMS is central control: one place for rules, permissions, concurrency and backup and recovery. It doesn't make every query instant or remove the need for good design." },
  { lv: 5, q: "Design A stores each customer once and orders refer to them by ID. Design B copies the customer's name and address into every order. Which is better for a growing store?", a: "A: one copy means addresses can't disagree", w: ["B: copies make every order self-contained", "B: fewer tables always make queries faster", "Neither: both store the facts the same way"], why: "B repeats the same facts in every order, so a change of address has to be made many times and the copies drift apart. A stores each fact once, which is the core of the database approach." },
  { lv: 6, t: "blank", q: "Complete the data hierarchy, smallest to largest: field → record → ______ → database.", a: "table", acc: ["table", "tables", "file", "table (file)", "table/file"], why: "Fields make a record, records of one kind make a table (called a file in older systems), and related tables make a database." },
  { lv: 6, q: "You're designing storage for a vet clinic that tracks owners, pets and visits. Which design follows the database approach?", a: "Related tables for owners, pets and visits, linked by keys", w: ["One file per vet with owners and pets copied into it", "One spreadsheet per pet holding its owner's details", "A text document for each visit, sorted by its date"], why: "Each kind of thing gets its own table, and keys link them (a pet row holds its owner's ID). Every fact is stored once, and the DBMS can enforce the links." },
  { lv: 6, t: "blank", q: "Fill in the blank: the database approach controls data ______ by storing each fact only once.", a: "redundancy", acc: ["redundancy", "data redundancy"], why: "Storing each fact once is controlled redundancy, which prevents copies from drifting apart (inconsistency)." },
  { lv: 6, q: "For the vet clinic, which rule should the DBMS enforce so that every visit belongs to a real pet?", a: "Each visit's pet ID must match an existing pet", w: ["Each pet must have at least ten recorded visits", "Each visit must be stored in a file of its own", "Each pet's name must be unique across owners"], why: "This is a referential rule: a visit's pet ID has to point at a pet that exists. You'll meet it formally as a foreign key in the next zone." },
  { lv: 6, t: "blank", q: "Fill in the blank: the software that stores, retrieves and protects a database is the database ______ system.", a: "management", acc: ["management"], why: "A database management system (DBMS) such as MySQL sits between users and the data, handling storage, retrieval, integrity, security, concurrency and recovery." }
],

[
  { lv: 4, q: "DEPT has rows with DeptID 10 and 20, and EMPLOYEE.DeptID is a foreign key to DEPT. With the default referential action, what happens?", code: "INSERT INTO employee (emp_id, dept_id) VALUES (7, 30);", a: "Rejected: department 30 doesn't exist", w: ["Inserted, with dept_id quietly set to NULL", "Inserted, and department 30 is created", "Inserted, since FKs are only checked on delete"], why: "A foreign key value must match an existing primary key. 30 isn't in DEPT, so the insert would create an orphan and is rejected. Foreign keys are checked on insert and update, not just delete." },
  { lv: 4, q: "R and S each have one column A. R contains {1, 2, 3} and S contains {2, 3, 4}. What is R − S (difference)?", a: "{1}", w: ["{4}", "{2, 3}", "{1, 4}"], why: "R − S keeps the rows of R that are not in S. 2 and 3 are in both, so only 1 remains. {4} would be S − R, and {2, 3} is the intersection." },
  { lv: 4, q: "A table's primary key is (OrderID, LineNo). A row arrives with OrderID 5 and LineNo NULL. Which rule rejects it?", a: "Entity integrity: no part of a PK may be NULL", w: ["Referential integrity: LineNo has no parent row", "Domain integrity: NULL isn't a whole number", "No rule; only the first key column is checked"], why: "Entity integrity applies to every column of the primary key, not just the first. A key with a missing part can't identify a row." },
  { lv: 5, q: "Deleting a customer should also delete their orders, but deleting a product must never touch past order lines. Which referential actions fit?", a: "Customer FK: CASCADE; product FK: RESTRICT", w: ["Customer FK: RESTRICT; product FK: CASCADE", "CASCADE on both foreign keys", "SET NULL on both foreign keys"], why: "CASCADE removes the children with the parent, which is what you want for a customer's orders. RESTRICT refuses to delete a product that order lines still reference, protecting order history." },
  { lv: 5, q: "Which is the best primary key for a STUDENT table?", a: "A university-issued StudentID", w: ["The student's full name", "The student's birth date", "The student's phone number"], why: "A primary key must be unique, never NULL and stable. Names and birth dates repeat across students, and phone numbers change or can be missing. A university-issued ID is all three." },
  { lv: 5, q: "A designer lets EMPLOYEE.DeptID be NULL for new hires who haven't been assigned a department yet. Evaluate the decision.", a: "Fine: an FK may be NULL when no parent applies", w: ["Wrong: a foreign key can never be NULL", "Wrong: it breaks entity integrity", "Fine, but only if DeptID is also UNIQUE"], why: "Foreign keys may be NULL unless declared NOT NULL; NULL means 'no department yet'. Entity integrity only restricts primary keys, and UNIQUE would wrongly allow just one employee per department." },
  { lv: 5, q: "Which condition correctly finds employees with no manager recorded?", a: "WHERE manager_id IS NULL", w: ["WHERE manager_id = NULL", "WHERE manager_id = 0", "WHERE manager_id = ''"], why: "A missing value is NULL, and only IS NULL tests for it. = NULL evaluates to unknown for every row, and 0 or an empty string are real values, not missing ones." },
  { lv: 5, q: "Some employees have a NULL bonus. A manager expects AVG(bonus) to treat those as 0. Evaluate what AVG(bonus) actually gives.", a: "It's higher than they expect: NULLs are skipped", w: ["It's what they expect: AVG treats NULL as zero", "It fails: AVG can't handle NULL values", "It's lower than they expect: NULLs pull it down"], why: "AVG skips NULLs, dividing only by the employees who have a bonus. Counting NULLs as 0 would add zeros and lower the average. To get that, use AVG(COALESCE(bonus, 0))." },
  { lv: 6, t: "blank", q: "Complete the rule: a foreign key value must either be NULL or match an existing ______ key value in the referenced table.", a: "primary", acc: ["primary", "primary key", "candidate", "candidate key"], why: "A foreign key points at the primary (or another candidate) key of the parent table. That match is what referential integrity guarantees." },
  { lv: 6, t: "blank", q: "Fill in the relational operation: ______ keeps only the rows that pass a condition, while project keeps only chosen columns.", a: "select", acc: ["select", "selection", "σ", "sigma"], why: "Select (σ) filters rows by a condition; project (π) picks columns. SQL's WHERE clause does selection, and its SELECT list does projection, which is why the names are easy to mix up." },
  { lv: 6, q: "Which relational algebra expression lists the names of students majoring in IS?", a: "π Name (σ Major='IS' (Student))", w: ["σ Name (π Major='IS' (Student))", "π Major='IS' (σ Name (Student))", "σ Major='IS' (Student) × π Name"], why: "Work inside out: first select (σ) the IS rows, then project (π) just the Name column. Swapping them misuses each operation: σ takes a condition, π takes a column list." },
  { lv: 6, t: "blank", q: "Complete the constraint so deleting a department sets its employees' dept_id to empty.", code: "FOREIGN KEY (dept_id) REFERENCES dept(dept_id)\n  ON DELETE ______", a: "SET NULL", acc: ["SET NULL"], why: "ON DELETE SET NULL puts NULL into the child rows' foreign key when the parent is deleted. It only works if dept_id allows NULL." },
  { lv: 6, q: "A status column may only hold 'open', 'closed' or 'hold'. Which definition enforces that domain?", a: "CHECK (status IN ('open', 'closed', 'hold'))", w: ["UNIQUE (status, 'open', 'closed', 'hold')", "FOREIGN KEY (status) REFERENCES 'open'", "DEFAULT ('open', 'closed', 'hold')"], why: "CHECK enforces domain integrity with an expression, and IN lists the allowed values. UNIQUE prevents duplicates, a FOREIGN KEY references a table, and DEFAULT supplies one value when none is given." },
  { lv: 3, t: "blank", q: "Complete the condition to find customers whose phone is missing.", code: "SELECT * FROM customer\nWHERE phone ______;", a: "IS NULL", acc: ["IS NULL"], why: "IS NULL is the only correct test for a missing value. phone = NULL would be unknown for every row and return nothing." }

[

  { lv: 5, q: "You need to give all G-rated films a 10% raise. Which approach is safest?", a: "Run a SELECT with the same WHERE first, then UPDATE", w: ["Run the UPDATE without WHERE, then fix the others", "DROP the table and re-insert it with new prices", "UPDATE every film, then lower the non-G ones"], why: "Running SELECT … WHERE rating = 'G' first shows exactly which rows the UPDATE will change. The other approaches touch rows that shouldn't change and depend on a second step to repair them." },
  { lv: 5, q: "Which column definition best fits a price in dollars and cents?", a: "price DECIMAL(8,2) NOT NULL", w: ["price VARCHAR(10) NOT NULL", "price INT UNSIGNED NOT NULL", "price FLOAT NOT NULL"], why: "DECIMAL stores exact values with a fixed number of decimal places, which money needs. VARCHAR stores text (so it sorts '10' before '9'), INT drops the cents, and FLOAT is approximate and can produce rounding errors." },
  { lv: 5, q: "You must remove every row from a log table but keep the table for new rows. Which statement is right?", a: "DELETE FROM log;", w: ["DROP TABLE log;", "DELETE TABLE log;", "ALTER TABLE log DROP ROWS;"], why: "DELETE FROM without WHERE removes every row and keeps the empty table. DROP TABLE removes the table itself, and DELETE TABLE and DROP ROWS aren't valid SQL." },
  { lv: 5, q: "Which column definition best stops two members from sharing an email address?", a: "email VARCHAR(100) NOT NULL UNIQUE", w: ["email VARCHAR(100) CHECK (email)", "email VARCHAR(100) DEFAULT 'none'", "email VARCHAR(100) REFERENCES member"], why: "UNIQUE rejects any value that already exists in the column, and NOT NULL makes sure every member has one. CHECK tests an expression within the row, DEFAULT supplies a value, and REFERENCES links to another table." },
  { lv: 5, q: "A teammate wants to store birth dates as VARCHAR(10) text like '10/14/2026'. What's the best response?", a: "Use DATE so dates sort and compare correctly", w: ["VARCHAR is fine, since a date is just text", "Use INT and store only the year number", "Use CHAR(10), which is faster than VARCHAR"], why: "Text dates sort character by character, so '10/14/2026' comes before '9/1/2025', and comparisons and date math don't work. DATE stores real dates that sort and compare correctly." },
  { lv: 6, t: "blank", q: "Fill in the keyword so MySQL numbers new genres automatically.", code: "CREATE TABLE genre (\n  genre_id INT ______ PRIMARY KEY,\n  name VARCHAR(50) NOT NULL\n);", a: "AUTO_INCREMENT", acc: ["AUTO_INCREMENT"], why: "AUTO_INCREMENT assigns the next number whenever you insert a row without a genre_id." },

[
  { lv: 4, q: "What does this output?", code: "-- emp(name, dept, salary): (Ann, IT, 70), (Bo, IT, 50), (Cy, HR, 60)\nSELECT dept, SUM(salary) AS total\nFROM emp\nGROUP BY dept\nHAVING SUM(salary) > 100;", a: "One row: IT, 120", w: ["Two rows: IT, 120 and HR, 60", "One row: HR, 60", "No rows at all"], why: "Grouping gives IT = 70 + 50 = 120 and HR = 60. HAVING keeps only groups whose total is over 100, so only IT survives." },
  { lv: 5, q: "You need every customer with their total payments, including customers with no payments. Which approach is right?", a: "customer LEFT JOIN payment, GROUP BY customer", w: ["customer INNER JOIN payment, GROUP BY customer", "customer CROSS JOIN payment, GROUP BY customer", "payment LEFT JOIN customer, GROUP BY customer"], why: "LEFT JOIN keeps every row of the left table, so customers with no payments stay (with NULL amounts). INNER JOIN drops them, CROSS JOIN pairs everything, and payment LEFT JOIN customer keeps every payment rather than every customer." },
  { lv: 5, q: "Which WHERE clause correctly finds G or PG films longer than 120 minutes?", a: "(rating = 'G' OR rating = 'PG') AND length > 120", w: ["rating = 'G' OR rating = 'PG' AND length > 120", "rating = 'G' AND rating = 'PG' AND length > 120", "rating IN ('G' AND 'PG') OR length > 120"], why: "AND runs before OR, so without parentheses only the PG films get the length test. Parentheses group the ratings first. A film can't be G and PG at once, and the last option uses IN and OR incorrectly." },
  { lv: 5, q: "You need to count how many films each actor appears in. Which approach is best?", a: "GROUP BY actor_id with COUNT(film_id)", w: ["COUNT(DISTINCT actor_id) with no GROUP BY", "ORDER BY actor_id with SUM(film_id)", "GROUP BY film_id with COUNT(actor_id)"], why: "One result row per actor means GROUP BY actor_id, and COUNT counts the films in each group. COUNT(DISTINCT actor_id) gives one total, summing film IDs is meaningless, and grouping by film counts actors per film." },
  { lv: 5, q: "Which of these filters must go in HAVING rather than WHERE?", a: "AVG(length) > 110", w: ["rating = 'PG'", "length BETWEEN 90 AND 120", "title LIKE 'A%'"], why: "Only the condition on an aggregate needs groups to exist, so it belongs in HAVING. The others test single rows and belong in WHERE, which filters before grouping." },
  { lv: 5, q: "Evaluate this query for showing each film's language.", code: "SELECT f.title, l.name\nFROM film f JOIN language l;", a: "Missing ON: it pairs every film with every language", w: ["Correct: JOIN matches the keys automatically", "Correct, but it should be a LEFT JOIN instead", "Missing GROUP BY on language_id"], why: "Without an ON condition, MySQL treats it as a cross join: every film paired with every language. Add ON l.language_id = f.language_id. JOIN doesn't guess which keys to match." },
  { lv: 6, t: "blank", q: "Fill in the clause that keeps only ratings with more than 200 films.", code: "SELECT rating, COUNT(*)\nFROM film\nGROUP BY rating\n______ COUNT(*) > 200;", a: "HAVING", acc: ["HAVING"], why: "HAVING filters groups after GROUP BY, so it can test COUNT(*). WHERE runs before groups exist." },
  { lv: 6, t: "blank", q: "Fill in the join type that keeps customers who have no payments.", code: "SELECT c.first_name, p.amount\nFROM customer c\n______ JOIN payment p ON p.customer_id = c.customer_id;", a: "LEFT", acc: ["LEFT", "LEFT OUTER"], why: "LEFT JOIN keeps every row of the left table (customer) and fills payment's columns with NULL where there's no match." },

  { lv: 3, q: "What does this output?", code: "-- item prices: 2, 5, 8\nSELECT 6 > ALL (SELECT price FROM item),\n       6 > ANY (SELECT price FROM item);", a: "0, 1", w: ["1, 1", "0, 0", "1, 0"], why: "> ALL means greater than the maximum (8), and 6 isn't, so 0. > ANY means greater than at least one value; 6 > 2, so 1." },
  { lv: 3, q: "After this UPDATE, does film 9 appear in SELECT * FROM cheap?", code: "CREATE VIEW cheap AS\nSELECT title, rental_rate FROM film WHERE rental_rate < 1;\n\nUPDATE film SET rental_rate = 0.50 WHERE film_id = 9;", a: "Yes: the view reads film's current data", w: ["No: the view kept the rows from when it was made", "Only after CREATE OR REPLACE VIEW is run again", "No: views can't see rows changed by UPDATE"], why: "A view stores its query, not a copy of the rows. Each time you query cheap, it runs against film as it is now, and film 9 now costs 0.50." },
  { lv: 5, q: "You need customers who have never rented, and rental.customer_id may contain NULLs. Which condition is safest?", a: "NOT EXISTS (… WHERE r.customer_id = c.customer_id)", w: ["customer_id NOT IN (SELECT customer_id FROM rental)", "customer_id <> ALL (SELECT customer_id FROM rental)", "customer_id != (SELECT customer_id FROM rental)"], why: "If the subquery returns any NULL, NOT IN and <> ALL can never be TRUE, so they return no rows. != with a multi-row subquery is an error. NOT EXISTS only checks whether a matching row exists, so NULLs don't break it." },
  { lv: 5, q: "HR staff must see employee names and departments but never salaries. What is the best solution?", a: "A view without the salary column, granted to HR", w: ["A copy of the table with the salaries deleted", "WITH CHECK OPTION on the employee table", "A derived table that renames the salary column"], why: "A view exposes only the columns HR should see and always shows current data. A copy goes stale and duplicates data, CHECK OPTION controls changes rather than visibility, and renaming a column doesn't hide it." },
  { lv: 5, q: "You want each film's title shown next to the overall average film length. Which tool fits best?", a: "A scalar subquery in the SELECT list", w: ["A correlated EXISTS in the WHERE clause", "A row subquery comparing two columns", "A view defined WITH CHECK OPTION"], why: "(SELECT AVG(length) FROM film) returns one value, so it can sit in the SELECT list and appear on every row. EXISTS filters rows, a row subquery compares columns, and CHECK OPTION governs updates." },
  { lv: 5, q: "Evaluate this condition.", code: "SELECT title FROM film\nWHERE length = (SELECT MAX(length) FROM film);", a: "Fine: MAX returns exactly one value", w: ["Error: subqueries can't use aggregates", "Error: = always needs IN with a subquery", "Fine, but only when used inside a view"], why: "= needs exactly one value, and an aggregate with no GROUP BY returns one row, so it's valid. It returns the longest film (or films, if several tie)." },
  { lv: 5, q: "A dashboard runs the same four-table join 50 times a day. What's the best improvement?", a: "Save the join as a view and query the view", w: ["Paste the full join into every report by hand", "Replace the joins with nested NOT IN subqueries", "Run it as one CROSS JOIN of all four tables"], why: "A view keeps the join in one place, so every report uses the same correct logic and a fix happens once. Copy-pasting duplicates the logic, NOT IN changes the meaning, and a CROSS JOIN produces a huge meaningless product." },
  { lv: 6, t: "blank", q: "Fill in the function to find films longer than the average length.", code: "SELECT title FROM film\nWHERE length > (SELECT ______(length) FROM film);", a: "AVG", acc: ["AVG"], why: "The uncorrelated subquery SELECT AVG(length) FROM film runs once and returns one value, which the outer WHERE compares against." },
  { lv: 6, t: "blank", q: "Fill in the operator to find customers who have rented at least once.", code: "SELECT c.first_name FROM customer c\nWHERE ______ (SELECT 1 FROM rental r\n              WHERE r.customer_id = c.customer_id);", a: "EXISTS", acc: ["EXISTS"], why: "EXISTS is TRUE when the correlated subquery finds at least one rental for the current customer. NOT EXISTS would find customers who never rented." },
  { lv: 6, t: "blank", q: "Fill in the keyword that defines a view.", code: "______ VIEW long_films AS\nSELECT title, length FROM film WHERE length > 150;", a: "CREATE", acc: ["CREATE", "CREATE OR REPLACE"], why: "CREATE VIEW name AS SELECT … saves the query under a name. CREATE OR REPLACE VIEW also works and redefines it if it already exists." },
  { lv: 6, t: "blank", q: "Fill in the keyword that names the derived table.", code: "SELECT AVG(total)\nFROM (SELECT customer_id, SUM(amount) AS total\n      FROM payment GROUP BY customer_id) ______ t;", a: "AS", acc: ["AS"], why: "A subquery in FROM must be given an alias: (…) AS t. MySQL also accepts the alias without AS, but you have to write a name." },
  { lv: 6, t: "blank", q: "The subquery returns many film IDs. Fill in the operator to find films stocked at store 2.", code: "SELECT title FROM film\nWHERE film_id ______ (SELECT film_id FROM inventory WHERE store_id = 2);", a: "IN", acc: ["IN", "= ANY", "=ANY", "= SOME", "=SOME"], why: "IN tests whether film_id is one of the values the subquery returns. = alone would fail because the subquery returns more than one row." }

  { lv: 4, q: "'Each room belongs to a building and is numbered within it, so Room 101 exists in several buildings.' What kind of entity is Room?", a: "A weak entity, identified with its building", w: ["A kernel (independent) entity with its own key", "A supertype of Building", "A derived attribute of Building"], why: "Room 101 alone doesn't identify a room; you need the building too. An entity that's identified through its owner is weak, and its key is the owner's key plus its own partial key." },
  { lv: 4, q: "Every employee is either full-time or part-time, never both. Which kind of specialization is that?", a: "Disjoint and total", w: ["Overlapping and total", "Disjoint and partial", "Overlapping and partial"], why: "'Never both' means disjoint. 'Every employee is one of them' means total (complete): no employee is in neither subtype." },

      { q: "In a correlated subquery that reuses the outer table, what keeps the columns straight?", a: "Table aliases", w: ["ORDER BY", "GROUP BY", "Renaming the table permanently"], lv: 2, why: "When the subquery uses the same table as the outer query, aliases (film f outside, film f2 inside) make it clear which copy each column belongs to." }
    ] },
  mc: [
    { q: "How is an uncorrelated subquery run?", a: "Inner query once, then the outer query uses its result", w: ["Outer query once for each row of the inner query", "Both queries at the same time, then merged", "Inner query again for every row of the outer query"], lv: 2, why: "An uncorrelated subquery doesn't mention the outer query, so it can run once on its own; its result is plugged into the outer query, which then runs. A correlated subquery is the one re-run for each outer row." },
    { q: "A subquery is correlated when…", a: "Its WHERE references a column from the outer query", w: ["It uses GROUP BY inside the parentheses", "It returns more than one row to the outer query", "It sits in the FROM clause as a derived table"], lv: 2, why: "A subquery is correlated when it refers to a column of the outer query (like WHERE r.customer_id = c.customer_id). Because it depends on the current outer row, it's re-evaluated for each one. Where it sits or how many rows it returns doesn't decide this." },
    { q: "EXISTS returns TRUE when…", a: "The subquery returns at least one row", w: ["The subquery returns exactly one row", "The subquery returns a NULL value", "The subquery returns no rows at all"], lv: 1, why: "EXISTS only checks whether the subquery returns any row at all: one or more is TRUE, none is FALSE. It doesn't look at the values, and NOT EXISTS is the reverse." },

    { q: "If a view's columns aren't named, they're named…", a: "The same as the view query's columns", w: ["col1, col2, col3 and so on", "After the table's primary key", "Nothing, so the CREATE VIEW fails"], lv: 1, why: "If you don't list column names in CREATE VIEW, the view's columns take the names of the columns (or aliases) in its SELECT." },

    { q: "Correlated subqueries commonly use…", a: "EXISTS", w: ["UNION", "LIKE", "BETWEEN"], lv: 2, why: "Correlated subqueries usually ask 'is there a related row for this outer row?', which is exactly what EXISTS (or NOT EXISTS) tests." }
  ],
  special: { type: "stack", title: "Assemble the subquery", prompt: "Lift the pieces into order. Goal: films longer than the average film length.",

{ name: "Thermal Vents", depth: [1000, 1400], topic: "ER to Relational Model", hull: 4, flora: "vent",

    counter: "Declare FOREIGN KEY constraints with sensible ON DELETE and ON UPDATE actions, and give weak entities their owner's key.",
    qs: [
      { q: "The Crab deletes a department, but its employees still list that DeptID. What was violated?", a: "Referential integrity", w: ["Entity integrity", "Domain integrity", "First normal form"], lv: 4, why: "The employees' DeptID values now point at a department that doesn't exist, which breaks referential integrity. Entity integrity is about primary keys being NOT NULL and unique." },
      { q: "Which ON DELETE action would have removed the orphaned rows automatically?", a: "CASCADE", w: ["RESTRICT", "SET NULL", "SET DEFAULT"], lv: 2, why: "ON DELETE CASCADE deletes the child rows along with the parent. RESTRICT would have refused the delete, and SET NULL would have kept the employees with an empty DeptID." },
      { q: "A weak entity's table without its owner's key is a crab without a shell. What must it include?", a: "The owner's primary key as part of its own PK", w: ["Only a surrogate key of its own", "Only its derived attributes, like its age", "Nothing extra; its partial key is enough"], lv: 3, why: "A weak entity can only be identified with its owner, so its table includes the owner's primary key as a foreign key, combined with its own partial key as the primary key." }
    ] },
  mc: [
    { q: "Why convert an ER diagram to a relational model?", a: "To implement it in an RDBMS", w: ["To make UML diagrams from it", "To generate printed reports", "To visualize the data in charts"], lv: 2, why: "A relational DBMS can only store tables, so the ER design has to be translated into relations, keys and constraints before you can build it." },
    { q: "How is a 1:N relationship implemented?", a: "The one side's PK goes in the many side as an FK", w: ["A new bridge table that holds the primary keys of both entities", "The many side's PK goes in the one side", "The two entities merge into one table"], lv: 3, why: "Put the primary key of the one side into the many side's table as a foreign key. One customer, many orders, so CustomerID goes in ORDER. Putting it the other way would need a list in one cell." },
    { q: "How is an M:N relationship implemented?", a: "A new relation whose PK combines both PKs", w: ["An FK placed on either one of the two sides", "A UNIQUE constraint on both primary keys", "Merging both entities into one table"], lv: 3, why: "M:N needs a new table (a bridge) whose primary key combines both sides' primary keys, each also a foreign key. Example: ENROLLS(StudentID, CourseID). A foreign key on either side could hold only one partner." },
    { q: "In an identifying relationship, the FK is part of the child's ______ key.", a: "primary", w: ["alternate", "candidate", "surrogate"], lv: 1, why: "In an identifying relationship, the parent's key becomes part of the child's primary key, because the child can only be identified together with its parent." },
    { q: "How is a subtype table's PK set up?", a: "Same as the supertype's PK, and also an FK to it", w: ["A new surrogate key generated for the subtype", "A composite of all of the subtype's columns", "Any column that happens to be unique"], lv: 3, why: "A subtype table uses the same primary key as its supertype, and that key is also a foreign key to the supertype table. That links each Car row to exactly one Vehicle row." },
    { q: "A multivalued attribute like Skill becomes…", a: "A new table keyed by the entity's PK plus Skill", w: ["A single comma-separated Skill column", "Numbered columns like Skill1, Skill2, Skill3", "A derived column calculated from other skills"], lv: 3, why: "A multivalued attribute becomes its own table holding the owner's primary key plus the value, both together as the primary key: EMPLOYEE_SKILL(EmployeeID, Skill). A list in one column breaks 1NF." },
    { q: "Why does a 1:1 FK need UNIQUE?", a: "Without it, many rows could share a parent (1:N)", w: ["UNIQUE is what makes the column NOT NULL", "Foreign keys can't be indexed without it", "It isn't needed; a 1:1 foreign key behaves the same without it"], lv: 2, why: "A foreign key alone lets many child rows point at the same parent, which is 1:N. Adding UNIQUE limits each parent to one child, making it 1:1." },
    { q: "Total participation (a double line) on the FK side becomes…", a: "A NOT NULL foreign key", w: ["A UNIQUE constraint", "A CHECK constraint", "A surrogate key"], lv: 3, why: "Total participation means every row must take part in the relationship, so on the foreign key side the FK can't be empty: NOT NULL." },
    { q: "Why can't Male–Female Marriage (1:1, partial on both sides) be merged into one table?", a: "No attribute is always NOT NULL", w: ["It's actually many-to-many", "Both entities are weak entities", "The table would have too many attributes"], lv: 4, why: "With partial participation on both sides, there are men with no wife and women with no husband. In one merged table, either key column could be empty for some rows, so neither can be a NOT NULL primary key." }

{ name: "Abyssal Trench", depth: [1400, 2000], topic: "Normalization", hull: 4, flora: "trench",
  pal: { top: "#050d1f", bot: "#000000", fog: "#03060f", floor: "#0b0d14" },
  creature: { id: "leviathan", name: "Anomaly Leviathan", hp: 4,
    practice: "Unnormalized tables that cause update, insertion and deletion anomalies",
    lore: "The apex predator of bad design. Its body is one enormous table where every fact repeats. Touch one scale and forty others disagree.",
    counter: "Normalize by decomposing tables so each fact lives in exactly one place.",
    qs: [
      { q: "Changing an instructor's phone means editing 40 rows, and one gets missed. Which anomaly is that?", a: "Update anomaly", w: ["Insertion anomaly", "Deletion anomaly", "Transitive dependency"], lv: 2, why: "The same fact (the phone) is stored in many rows, and changing it means updating all of them. Missing one leaves the data disagreeing: an update anomaly." },
      { q: "Deleting the last student in a course also erases the course's room. Which anomaly is that?", a: "Deletion anomaly", w: ["Update anomaly", "Insertion anomaly", "Partial dependency"], lv: 2, why: "Deleting one fact (the last enrollment) also erased an unrelated fact (the course's room) because they shared a row: a deletion anomaly." },
      { q: "You can't record a new course until a student enrolls. Which anomaly is that?", a: "Insertion anomaly", w: ["Deletion anomaly", "Update anomaly", "Cartesian product"], lv: 2, why: "You can't store one fact (the new course) without inventing another (a student enrollment) because they're in the same table: an insertion anomaly." },
      { q: "What cures all three anomalies?", a: "Normalizing so each fact is stored once", w: ["Adding indexes to every repeated column", "Allowing more NULLs in the big table", "Merging the tables into one larger table"], lv: 2, why: "All three anomalies come from storing the same fact in many rows. Normalizing splits tables so each fact is stored once, which removes them. Indexes and NULLs don't change what's stored where." }
    ] },
  mc: [
    { q: "X → Y means…", a: "Each X value determines exactly one Y value", w: ["Each Y value determines exactly one X value", "X and Y are both candidate keys", "X and Y always hold equal values"], lv: 1, why: "X → Y means knowing X tells you exactly one Y. StudentID → Name: each student ID goes with one name. It doesn't work backwards; many students can share a name." },
    { q: "A candidate key is…", a: "A minimal super key", w: ["Any set of attributes", "A foreign key", "A non-key column"], lv: 1, why: "A candidate key is a superkey with nothing extra: it uniquely identifies rows, and removing any column would break that." },
    { q: "A table is in 1NF when…", a: "Every field is atomic with no repeating groups", w: ["It has no partial dependencies on the key", "It has no transitive dependencies at all", "Every determinant in it is a superkey"], lv: 1, why: "1NF requires atomic values (one value per cell) and no repeating groups (no Phone1, Phone2, Phone3). Partial and transitive dependencies are what 2NF and 3NF deal with." },
    { q: "2NF removes…", a: "Partial dependencies on part of a composite key", w: ["Transitive dependencies between non-key columns", "Repeating groups and multivalued fields", "Multivalued dependencies between columns"], lv: 2, why: "2NF removes partial dependencies, where a non-key column depends on only part of a composite key, like StudentName depending only on StudentID in (StudentID, CourseID)." },
    { q: "3NF removes…", a: "Transitive dependencies between non-key columns", w: ["Partial dependencies on part of a composite key", "Repeating groups stored in one field", "NULL values in non-key columns"], lv: 2, why: "3NF removes transitive dependencies, where a non-key column depends on another non-key column (EmpID → DeptID → DeptName)." },
    { q: "A table is in BCNF when…", a: "Every determinant is a superkey", w: ["It has a single-column primary key", "It has no NULLs in any column", "It has no foreign keys at all"], lv: 1, why: "BCNF requires that every determinant (the left side of any dependency) is a superkey. It's a stricter version of 3NF." },
    { q: "A 1NF table with a single-column primary key is automatically in…", a: "2NF", w: ["3NF", "BCNF", "No normal form"], lv: 4, why: "A partial dependency means depending on part of the key, which needs a key with more than one column. A single-column key has no parts, so a 1NF table with one is automatically in 2NF." },
    { q: "Old(A, B, D) has key (A, B, D) and A → C. What's the BCNF fix?", a: "Old(A, B, D) plus New(A, C) with key A", w: ["Old(A, B, C, D) with C added to the key", "Old(B, C, D), deleting A from the table", "Old(A, B, C, D) with (A, C) as the key"], lv: 4, why: "A → C has a determinant (A) that isn't a superkey, which breaks BCNF. Move the dependency to its own table, New(A, C) with key A, and keep A in Old as the link." },
    { q: "USER(UserID, Email, City, State, Zip): what breaks 3NF?", a: "Zip → City, State", w: ["UserID → Email", "UserID → Zip", "Nothing breaks it"], lv: 4, why: "Zip → City, State is a dependency between non-key columns (a transitive one through Zip), which breaks 3NF. Split out ZIPCODE(Zip, City, State) and keep Zip in USER." },
    { q: "Does PassengerNumber depend on PassengerName?", a: "No. Two passengers can share a name", w: ["Yes. A name always determines the number", "Only once the table is in BCNF", "Yes, if every name is unique today"], lv: 4, why: "A dependency must hold for every possible row, not just today's data. Two passengers can share a name, so a name can't determine a passenger number." }
  ],
  special: { type: "sort", title: "Classify the fractures", prompt: "Each sample gives a key and a dependency. Is it partial, transitive, or fine?",
    bins: ["Partial: breaks 2NF", "Transitive: breaks 3NF", "Fine"],
    items: [

/* 1 · Coral Plateau · Relational databases */
{ mc: [
  { q: "Because a relation is a set, it…", a: "Has no duplicate rows and no fixed row order", w: ["Must always be sorted by its primary key", "Can hold duplicate rows if they have NULLs", "Has its columns in a required, fixed order"], lv: 2, why: "Mathematically a relation is a set of tuples, and sets have no duplicates and no order. That's why a well-designed table has a primary key, and why you need ORDER BY to get rows in a particular order." },
  { q: "How does a data type differ from a domain?", a: "A type is the storage format; a domain adds meaning and allowed values", w: ["They are the same thing, just named differently in SQL", "A domain is a kind of index built on a column's values", "A data type lists a column's allowed values; a domain is its storage format"], lv: 2, why: "A data type says how a value is stored (INT, VARCHAR, DATE). A domain adds meaning and the allowed values on top. Age and Quantity can both be INT, but ages of 0 to 120 and quantities of 1 to 999 are different domains." },
  { q: "R has 3 rows and S has 4 rows. How many rows does the product R × S have?", a: "12", w: ["7", "4", "3"], lv: 3, why: "Product pairs every row of R with every row of S, so the row count multiplies: 3 × 4 = 12. Adding them (7) is the mistake to avoid; that's what a UNION of disjoint tables would give." },
  { q: "R has 3 columns and S has 2. What is the degree of R × S?", a: "5", w: ["6", "3", "2"], lv: 3, why: "Product puts the columns of both tables side by side, so degrees add: 3 + 2 = 5. Rows multiply, columns add." },
  { q: "Two tables can be combined with UNION only if they are…", a: "Union-compatible: same number of columns, compatible types", w: ["Linked to each other by a foreign key relationship on their primary keys", "The same size, with an equal number of rows", "Both sorted the same way on their primary keys"], lv: 2, why: "UNION stacks the rows of two results into one table, so every row must fit the same set of columns: the same number of columns, with compatible types in the same order. A foreign key link isn't required, and the tables can have different row counts." },
  { q: "Which relational operation is NOT commutative (R op S ≠ S op R)?", a: "Difference", w: ["Union", "Intersect", "Natural join"], lv: 4, why: "R − S keeps rows of R that aren't in S, and S − R keeps rows of S that aren't in R, so swapping the tables changes the answer. Union and intersect give the same rows either way." },
  { q: "Project (π) in relational algebra…", a: "Keeps only the listed columns and removes duplicate rows", w: ["Keeps only the rows that pass a given condition", "Pairs every row of one table with every row of another", "Combines the rows of two tables into one result"], lv: 1, why: "Project (π) picks columns, and because a relation is a set it also removes any duplicate rows that result. Select (σ) is the one that picks rows by a condition, which is easy to confuse because SQL's SELECT keyword does projection." },
  { q: "A join is equivalent to…", a: "A product followed by a select on the join condition", w: ["A union followed by a project on the shared columns", "The difference of two tables on their keys", "An intersect followed by a sort on the key"], lv: 2, why: "A join is a product (every pairing of rows) followed by a select that keeps only the pairs where the join condition is true. Leave the condition out and you're left with the raw product, which is why a missing ON gives a Cartesian product." },
  { q: "Entity integrity says…", a: "No part of a primary key may be NULL", w: ["Every foreign key must match a primary key", "Every value must come from the column's domain", "Every table must be in third normal form"], lv: 1, why: "Entity integrity: no part of a primary key may be NULL, because a key with a missing value can't identify a row. 'Every FK must match a PK' is referential integrity, a different rule." },
  { q: "Domain integrity says…", a: "Every value must come from its column's domain", w: ["Primary key columns can never hold NULL", "Every foreign key must match an existing PK", "Every table must be reachable through a view"], lv: 1, why: "Domain integrity: every value in a column must come from that column's domain (correct type, allowed range). It's enforced with data types, NOT NULL, CHECK and DEFAULT. The key rules are entity and referential integrity." },
  { q: "A rule like 'an order can't ship before it's placed' is…", a: "An enterprise (business) constraint", w: ["An entity integrity rule on the key", "A referential integrity (FK) rule", "A primary key uniqueness rule"], lv: 2, why: "Rules that come from how the business works, like 'ship date can't be before order date', are enterprise (business) constraints. They aren't about keys, so they're neither entity nor referential integrity. In SQL they're often written as CHECK constraints." },
  { q: "FALSE AND NULL is…", a: "FALSE", w: ["NULL", "TRUE", "An error"], lv: 3, why: "With AND, a single FALSE makes the whole expression FALSE, whatever the other side is. So FALSE AND NULL is FALSE even though one side is unknown." },
  { q: "FALSE OR NULL is…", a: "NULL", w: ["FALSE", "TRUE", "An error"], lv: 3, why: "With OR, a single TRUE would decide it, but FALSE doesn't decide anything. FALSE OR unknown depends on the unknown value, so the result stays unknown: NULL." },
  { q: "Which RDBMS component picks the most efficient way to run a query?", a: "The query optimizer", w: ["The buffer manager", "The data dictionary", "The transaction manager"], lv: 1, why: "The query optimizer considers different ways to run a query (which index to use, which join order) and picks the cheapest. The parser checks syntax, and the buffer manager handles memory." },
  { q: "Which RDBMS component makes a group of changes all succeed or all fail?", a: "The transaction manager", w: ["The query optimizer", "The parser", "The buffer manager"], lv: 1, why: "The transaction manager makes a group of changes atomic: all of them happen or none do. It also controls concurrency so two users' changes don't corrupt each other, and handles recovery after a crash." },
  { q: "Which RDBMS component keeps recently used data pages in memory?", a: "The buffer manager", w: ["The parser", "The transaction manager", "The query optimizer"], lv: 1, why: "The buffer manager keeps recently used data pages in memory, so repeated reads don't have to go back to disk, which is far slower." },
  { q: "In client-server RDBMS architecture, the client…", a: "Sends SQL to the server and shows the results", w: ["Stores the data files and indexes on its disk", "Runs the query optimizer for every statement", "Holds the data dictionary for the database"], lv: 1, why: "In client-server architecture the client (like MySQL Workbench) sends SQL to the server and displays the results. The server stores the data files, runs the optimizer and holds the data dictionary." }
  ],
  qs: [

    { q: "The Wraith whispers: FALSE OR NULL. What is it?", a: "NULL", w: ["FALSE", "TRUE", "0"], lv: 3, why: "FALSE doesn't decide an OR; only TRUE does. FALSE OR unknown depends on the unknown, so the result is NULL." }

/* 2 · Grassy Dunes · SQL Part 1 */
{ mc: [
  { q: "What's wrong with this statement?", code: "CREATE TABLE album (\n  album_id INT PRIMARY KEY\n  title VARCHAR(100) NOT NULL\n);", a: "A comma is missing between the column definitions", w: ["VARCHAR can't be given a length like (100)", "PRIMARY KEY must go on the last column instead", "Table and column names must be in uppercase"], lv: 4, why: "Inside CREATE TABLE, every column definition and table-level constraint is separated by a comma. 'album_id INT PRIMARY KEY' is missing the comma before the next line, so MySQL reads it as one broken definition." },
  { q: "Find the error in this INSERT.", code: "INSERT INTO artist (artist_id, name)\nVALUES (7, 'Nina', 'Jazz');", a: "It gives 3 values for 2 columns", w: ["artist_id can't be a number", "Strings need double quotes", "VALUES must come before the column list"], lv: 4, why: "The column list names 2 columns (artist_id, name) but VALUES supplies 3 values. The counts must match, value for column, in order." },
  { q: "Why does this INSERT fail?", code: "INSERT INTO artist (artist_id, name)\nVALUES (8, Nina);", a: "The text value needs quotes: 'Nina'", w: ["The column list is optional, so it's an error", "8 must be in quotes", "INSERT needs a WHERE"], lv: 4, why: "Text values must be in single quotes. Without them MySQL treats Nina as a column name, can't find one, and fails. Numbers like 8 don't need quotes." },
  { q: "Which statement lists the tables in the current database?", a: "SHOW TABLES;", w: ["SELECT TABLES;", "LIST TABLES;", "DESCRIBE DATABASE;"], lv: 1, why: "SHOW TABLES; lists the tables in the database you selected with USE. SHOW DATABASES; lists databases, and DESCRIBE shows one table's columns." },
  { q: "Which statement shows a table's columns and their types?", a: "DESCRIBE customer;", w: ["SHOW customer;", "SELECT COLUMNS customer;", "USE customer;"], lv: 1, why: "DESCRIBE customer; (or SHOW COLUMNS FROM customer;) lists each column with its type, whether it allows NULL, key information and default. SHOW TABLES only lists table names." },
  { q: "Which adds an email column to customer?", a: "ALTER TABLE customer ADD COLUMN email VARCHAR(100);", w: ["UPDATE customer ADD COLUMN email VARCHAR(100);", "INSERT COLUMN email VARCHAR(100) INTO customer;", "CREATE COLUMN email VARCHAR(100) ON customer;"], lv: 3, why: "Changing a table's structure is a DDL job, so it's ALTER TABLE … ADD COLUMN. UPDATE changes values in existing rows, INSERT adds rows, and there's no CREATE COLUMN statement." },
  { q: "Which changes an existing column's data type?", a: "ALTER TABLE … MODIFY COLUMN", w: ["UPDATE … SET TYPE", "ALTER TABLE … ADD COLUMN", "DROP the table, then INSERT"], lv: 3, why: "ALTER TABLE … MODIFY COLUMN redefines an existing column (its type, size or NULL rule), for example MODIFY COLUMN email VARCHAR(200). ADD COLUMN would create a second column instead." },
  { q: "Is a 120-minute film returned?", code: "SELECT title FROM film\nWHERE length BETWEEN 90 AND 120;", a: "Yes. BETWEEN includes both end values", w: ["No. BETWEEN excludes the upper value", "No. BETWEEN excludes both ends", "Only if length is NOT NULL is declared"], lv: 3, why: "BETWEEN is inclusive: length BETWEEN 90 AND 120 means length >= 90 AND length <= 120. A 120-minute film satisfies <= 120, so it's returned." },
  { q: "What does this return?", code: "SELECT title FROM film\nWHERE rental_rate BETWEEN 4.99 AND 0.99;", a: "No rows: the smaller value must come first", w: ["Films priced from 0.99 up to 4.99", "An error, because the range is reversed", "Every film, since BETWEEN ignores order"], lv: 4, why: "BETWEEN a AND b means value >= a AND value <= b. With 4.99 first, that's rate >= 4.99 AND rate <= 0.99, which no number satisfies. It isn't an error, just an empty result. Put the smaller value first." },
  { q: "Why name a constraint, as in CONSTRAINT fk_track_album FOREIGN KEY …?", a: "So you can refer to it later, such as to drop it", w: ["Unnamed constraints are never enforced by MySQL", "Naming it turns the column into a primary key", "Named constraints make inserts run much faster"], lv: 2, why: "Naming a constraint (CONSTRAINT fk_track_album …) lets you refer to it later, for example ALTER TABLE track DROP FOREIGN KEY fk_track_album. Unnamed constraints still work, but MySQL makes up a name you'd have to look up." },
  { q: "What does this do?", code: "ALTER TABLE track\nDROP FOREIGN KEY fk_track_album;", a: "Removes the foreign key rule; the column and data stay", w: ["Deletes the album_id column and all of its values", "Drops the album table that the key points to", "Deletes every track that has an album_id"], lv: 3, why: "DROP FOREIGN KEY removes only the rule. The album_id column and its values stay, and the album table is untouched; MySQL just stops checking that the values match." },
  { q: "What does DROP TABLE IF EXISTS temp; do when temp doesn't exist?", a: "Nothing happens, and no error is raised", w: ["It creates temp first, then drops it", "It raises a 'table not found' error", "It drops every table in the database"], lv: 2, why: "IF EXISTS makes DROP safe to run when the table might not be there: it does nothing instead of raising an error. That's why setup scripts often start with DROP TABLE IF EXISTS." },
  { q: "Which is a feature of SQL?", a: "It's declarative: you state what you want, not how", w: ["Keywords are case-sensitive: SELECT differs from select", "Each statement has to fit on a single line", "It can read data but can never change it"], lv: 2, why: "SQL is declarative: you describe the result (which rows, which columns) and the DBMS works out how to get it. Keywords aren't case-sensitive, statements can span lines, and SQL can change data too." },
  { q: "DELETE FROM film; versus DROP TABLE film;", a: "DELETE removes the rows; DROP removes the table itself", w: ["They do the same thing: both empty the table", "DROP removes the rows; DELETE removes the table", "DELETE removes the columns; DROP removes the rows"], lv: 2, why: "DELETE FROM film removes every row but keeps the empty table, ready for new rows. DROP TABLE film removes the table itself, structure and all." },
  { q: "Describe what this does.", code: "UPDATE film\nSET rental_rate = rental_rate * 1.10\nWHERE rating = 'G';", a: "Raises the rental rate by 10% for G-rated films only", w: ["Sets the rental rate of every film to exactly 1.10", "Raises the rental rate by 10% for every film", "Adds 1.10 to the rental rate of G-rated films"], lv: 3, why: "SET rental_rate = rental_rate * 1.10 multiplies the current rate by 1.10 (a 10% raise), and WHERE rating = 'G' limits it to G-rated films. Without the WHERE, every film would get the raise." },
  { q: "Which inserts two rows in one statement?", a: "INSERT INTO genre (name) VALUES ('Jazz'), ('Blues');", w: ["INSERT INTO genre (name) VALUES ('Jazz', 'Blues');", "INSERT INTO genre VALUES 'Jazz' AND 'Blues';", "INSERT 2 ROWS INTO genre ('Jazz', 'Blues');"], lv: 3, why: "One INSERT can add several rows: list each row's values in its own parentheses, separated by commas. ('Jazz', 'Blues') would be one row with two values, which doesn't fit a one-column list." }
  ],
  qs: [
    { q: "The Shark runs this. How many rows are left in rental?", code: "DELETE FROM rental;", a: "None. Every row is deleted", w: ["Only the first row is deleted", "It's an error without WHERE", "None are deleted without WHERE"], lv: 3, why: "DELETE without WHERE deletes every row, leaving an empty table. The table still exists; only DROP TABLE would remove it." }

/* 3 · Crystal Caves · SQL Part 2 */
{ mc: [
  { q: "Which operator means 'not equal' in MySQL?", a: "Both <> and !=", w: ["Only <> (!= is an error)", "Only != (<> is an error)", "Only =! in MySQL"], lv: 1, why: "MySQL accepts both <> (the SQL standard) and != for 'not equal'. =! isn't an operator." },
  { q: "What does this division query output?", code: "SELECT 10 / 4, 10 DIV 4, 10 % 4;", a: "2.5000, 2, 2", w: ["2, 2, 2", "2.5000, 3, 2", "2.5000, 2.5000, 0"], lv: 3, why: "/ is normal division with a decimal result (10 / 4 = 2.5000). DIV is whole-number division that drops the remainder (2). % gives the remainder: 10 = 4 × 2 + 2, so 2." },
  { q: "What does adding NULL output?", code: "SELECT 5 + NULL;", a: "NULL", w: ["5", "0", "An error"], lv: 3, why: "Any arithmetic with NULL gives NULL: if one number is unknown, the sum is unknown too. Use COALESCE(x, 0) if you want NULL treated as zero." },
  { q: "Which films come back?", code: "SELECT title FROM film\nWHERE rating = 'G' OR rating = 'PG' AND length > 120;", a: "All G films, plus PG films longer than 120 minutes", w: ["G or PG films, but only those longer than 120 minutes", "Only PG films that are longer than 120 minutes", "Only G films that are longer than 120 minutes"], lv: 4, why: "AND runs before OR, so this reads rating = 'G' OR (rating = 'PG' AND length > 120): every G film of any length, plus long PG films. To filter both ratings by length, add parentheses around the OR." },
  { q: "Which is the same as WHERE rating IN ('G', 'PG')?", a: "WHERE rating = 'G' OR rating = 'PG'", w: ["WHERE rating = 'G' AND rating = 'PG'", "WHERE rating BETWEEN 'G' AND 'PG'", "WHERE rating LIKE 'G%PG'"], lv: 2, why: "IN is shorthand for a list of ORs: rating IN ('G', 'PG') means rating = 'G' OR rating = 'PG'. AND would need a rating to be both at once, which can't happen." },
  { q: "What do these two NULL comparisons output?", code: "SELECT NULL = NULL, NULL <=> NULL;", a: "NULL, 1", w: ["1, 1", "NULL, NULL", "0, 1"], lv: 3, why: "= with NULL gives NULL (unknown) even for NULL = NULL. MySQL's NULL-safe operator <=> treats two NULLs as equal and returns 1." },
  { q: "What do these XOR expressions output?", code: "SELECT 1 XOR 1, 1 XOR 0;", a: "0, 1", w: ["1, 1", "1, 0", "0, 0"], lv: 3, why: "XOR is TRUE when exactly one side is TRUE. 1 XOR 1 has both true, so 0. 1 XOR 0 has exactly one, so 1." },
  { q: "With MySQL's default settings, does 'abc' = 'ABC' return 1?", a: "Yes, the default collation ignores case", w: ["No, string comparisons are case-sensitive", "Only when the comparison uses LIKE", "It raises an error for mixed case"], lv: 2, why: "MySQL's default collation is case-insensitive, so 'abc' = 'ABC' returns 1, and LIKE ignores case too. A case-sensitive (binary) collation would change that." },
  { q: "Which pattern finds last names ending in 'son'?", a: "LIKE '%son'", w: ["LIKE 'son%'", "LIKE '_son'", "LIKE 'son'"], lv: 3, why: "% stands for any number of characters, so '%son' means anything followed by son at the end: Johnson, Carson. 'son%' would mean starting with son." },
  { q: "How do you match a literal underscore with LIKE?", a: "LIKE '%\\_%'", w: ["LIKE '%_%'", "LIKE '%__%'", "LIKE '%[_]%'"], lv: 3, why: "In LIKE, _ is a wildcard for one character. To match an actual underscore, escape it with a backslash: '%\\_%'. '%_%' would match any string with at least one character." },
  { q: "A RIGHT JOIN B keeps…", a: "Every row of B, with NULLs where A has no match", w: ["Only the rows that match in both A and B", "Every row of A, with NULLs where B has no match", "Every row of both, matched or not"], lv: 2, why: "A RIGHT JOIN B keeps every row of B, the table on the right, filling A's columns with NULL where there's no match. It's the same as B LEFT JOIN A." },
  { q: "CROSS JOIN produces…", a: "Every row paired with every row (Cartesian product)", w: ["Only the rows that match on a shared key", "Rows in one table but not in the other", "The union of both tables' rows, without duplicates"], lv: 1, why: "CROSS JOIN deliberately produces the Cartesian product: every row of one table paired with every row of the other, with no condition. 10 rows × 5 rows gives 50." },
  { q: "NATURAL JOIN matches rows on…", a: "Every column the two tables share by name", w: ["The primary keys of both tables only", "The first column of each of the two tables", "Nothing; it's always a Cartesian product"], lv: 2, why: "NATURAL JOIN matches on every column the two tables share by name, not just the keys. In sakila many tables share last_update, so a NATURAL JOIN would also require equal timestamps and return the wrong rows. JOIN … USING (col) or ON is safer." },
  { q: "What does this find?", code: "SELECT c.first_name\nFROM customer c\nLEFT JOIN payment p ON p.customer_id = c.customer_id\nWHERE p.payment_id IS NULL;", a: "Customers who have never made a payment", w: ["Payments that have no matching customer", "Every customer, with their payments", "Customers whose payment amount is NULL"], lv: 4, why: "A LEFT JOIN keeps every customer; customers with no payment get NULL in all payment columns. Keeping only rows where payment_id IS NULL therefore leaves customers who never paid. This 'LEFT JOIN … IS NULL' pattern finds things with no match." },
  { q: "Find the error in this aggregate filter.", code: "SELECT rating, AVG(length)\nFROM film\nWHERE AVG(length) > 110\nGROUP BY rating;", a: "Aggregates can't go in WHERE; use HAVING", w: ["AVG needs DISTINCT inside its parentheses", "GROUP BY must be written before WHERE", "rating must be inside AVG() as well"], lv: 4, why: "WHERE runs before GROUP BY, so groups (and their averages) don't exist yet. Filtering on an aggregate belongs in HAVING: … GROUP BY rating HAVING AVG(length) > 110." },
  { q: "Find the error in this GROUP BY.", code: "SELECT rating, title, COUNT(*)\nFROM film\nGROUP BY rating;", a: "title is neither grouped nor aggregated", w: ["COUNT(*) needs a column name inside it", "GROUP BY must be followed by ORDER BY", "Nothing; it runs and lists every title"], lv: 4, why: "One rating group contains many different titles, so the database can't pick which title to show on that group's single row. Every SELECT column must be in GROUP BY or inside an aggregate." },
  { q: "What is the HR row of the output?", code: "-- emp(name, dept, salary):\n-- (Ann, IT, 70), (Bo, IT, 50), (Cy, HR, 60), (Di, HR, NULL)\nSELECT dept, COUNT(*), COUNT(salary), AVG(salary)\nFROM emp GROUP BY dept;", a: "HR, 2, 1, 60", w: ["HR, 2, 2, 30", "HR, 1, 1, 60", "HR, 2, 1, 30"], lv: 3, why: "HR has Cy (60) and Di (NULL). COUNT(*) counts both rows: 2. COUNT(salary) skips Di's NULL: 1. AVG skips it too, averaging just 60." },
  { q: "What does MAX minus MIN output?", code: "-- emp salaries: 70, 50, 60, NULL\nSELECT MAX(salary) - MIN(salary) FROM emp;", a: "20", w: ["70", "NULL", "10"], lv: 3, why: "MAX and MIN ignore NULL, so they compare 70, 50 and 60. MAX is 70, MIN is 50, and 70 − 50 = 20." },
  { q: "What does a column alias like AS total do?", a: "Renames the column in the result", w: ["Renames the column in the table", "Creates a new column in the table", "Filters the rows"], lv: 2, why: "AS total renames a column in the result only, like a label on the output. The table itself isn't changed. Because SELECT runs before ORDER BY, you can sort by the alias." },
  { q: "How do you join three tables?", a: "Chain joins: FROM a JOIN b ON … JOIN c ON …", w: ["You can't; a join takes exactly two tables", "List all three tables inside one ON clause", "Combine the three tables with UNION"], lv: 3, why: "Each extra table gets its own JOIN with its own ON condition: FROM film f JOIN film_category fc ON … JOIN category c ON …. Joins chain; they aren't limited to two tables." }
